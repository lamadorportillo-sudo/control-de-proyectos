name: Aplicación temporal de correcciones documentales

on:
  push:
    branches: [audit-architecture-fixes]
    paths:
      - 'scripts/apply-contract-document-audit-fixes.cjs'
      - '.github/workflows/apply-contract-document-audit-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Aplicar parches exactos
        run: node scripts/apply-contract-document-audit-fixes.cjs
      - name: Validar sintaxis y pruebas contractuales
        run: |
          node --check contract-payment-documents-v1.js
          node --check contract-preview-v1.js
          node --check contract-document-safety-v1.js
          node --check project-evaluation-dashboard-v1.js
          node --test tests/contract-payment-documents.test.cjs tests/contract-explicit-rules.test.cjs tests/project-evaluation-dashboard.test.cjs
      - name: Guardar únicamente los archivos corregidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contract-payment-documents-v1.js contract-preview-v1.js project-evaluation-dashboard-v1.js project-tabs-complete-v1.js
          git commit -m "Blindar documentos contractuales contra datos implícitos"
          git push origin HEAD:audit-architecture-fixes
