name: Validación aislada de arquitectura

on:
  push:
    branches: [audit-architecture-fixes]
    paths:
      - '*.js'
      - '*.cjs'
      - 'scripts/**'
      - 'tests/**'
      - 'supabase/**'
      - '.github/workflows/architecture-validation.yml'
      - '.github/workflows/deploy-pages-critical.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Descargar rama aislada
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validar inventario de Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/check-supabase-edge-functions.cjs
          node scripts/check-supabase-edge-functions.cjs

      - name: Validar sintaxis y contratos de arquitectura
        shell: bash
        run: |
          set -euo pipefail
          for f in ./*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
          node --check authenticated-module-manifest-v1.cjs
          node --check build-pages.cjs
          node --check inject-portfolio.cjs
          node --check patch-session-security.cjs
          node --check stabilize-core-v1.cjs
          node --check scripts/audit-system-1000.cjs
          node --check scripts/check-supabase-edge-functions.cjs
          node --check tests/admin-mfa-enforcement.test.cjs
          node --check tests/edge-functions-source-control.test.cjs
          node --check tests/admin-mfa-enforcement-browser.spec.cjs
          node --check tests/architecture-auth-boot.spec.cjs
          node --check tests/accessibility-responsive.spec.cjs
          node --check tests/contract-explicit-rules-browser.spec.cjs
          node --check tests/contract-document-safety-browser.spec.cjs
          node --test tests/*.test.cjs
          if grep -q 'Forzar solo versiones aún no centralizadas' .github/workflows/deploy-pages-critical.yml; then
            echo 'La publicación vuelve a modificar el HTML después de construirlo.' >&2
            exit 1
          fi

      - name: Construir exactamente el artefacto estabilizado
        shell: bash
        run: |
          set -euo pipefail
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          node stabilize-core-v1.cjs
          test -s index.html
          grep -q 'private-access-v1.js?v=20260904-private6' index.html
          grep -q 'performance-runtime-v1.js?v=20260904-perf10' index.html
          grep -q 'portal-web-v2.js?v=20260904-web4' index.html
          grep -q 'ui-stability-v1.js?v=20260904-stable2' index.html
          grep -q 'project-tabs-complete-v1.js?v=20260831-tabscomplete34' index.html
          grep -q 'ui-navigation-single-source-v1.js?v=20260903-singlenav2' index.html
          grep -q 'zordon-continuous-runtime-v1.js?v=20260824-zordon4' index.html
          grep -q 'zordon-chat-ui-v1.js?v=20260824-cleanchat4' index.html
          grep -q 'contract-explicit-rules-v1.js?v=20260904-explicit1' index.html
          grep -q 'project-evaluation-dashboard-v1.js?v=20260904-projectevaluation2' index.html
          grep -q 'contract-document-safety-v1.js?v=20260904-docsafety3' index.html
          grep -q 'contract-payment-documents-v1.js?v=20260904-advance-docs4' index.html
          grep -q 'contract-preview-v1.js?v=20260904-preview2' index.html
          grep -q '__CC_AUTH_BOOT_FAILED__' index.html
          grep -q '__CC_AUTH_MODULE_ERRORS__' index.html
          grep -q 'data-cc-auth-loader data-cc-auth-plan' index.html
          for retired in system-ui-refinement-v2.js dashboard-executive-v1.js home-executive-fix-v2.js industrial-home-v1.js portfolio-redesign-v1.js project-portfolio-detail-v1.js portfolio-screen-fix-v1.js; do
            if grep -q "$retired" index.html; then
              echo "El artefacto reactivó un módulo retirado: $retired" >&2
              exit 1
            fi
          done

      - name: Ejecutar comprobaciones masivas de integridad
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-system-1000.cjs

      - name: Instalar navegador de validación
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Servir artefacto aislado
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/architecture-validation-http.log 2>&1 &
          echo $! > /tmp/architecture-validation-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/architecture-validation-http.log
          exit 1

      - name: Probar arranque, MFA, contrato, documentos y accesibilidad serious/critical
        env:
          APP_URL: http://127.0.0.1:4173/
        shell: bash
        run: npx playwright test tests/architecture-auth-boot.spec.cjs tests/admin-mfa-enforcement-browser.spec.cjs tests/contract-explicit-rules-browser.spec.cjs tests/contract-document-safety-browser.spec.cjs tests/accessibility-responsive.spec.cjs --workers=1 --retries=0

      - name: Guardar diagnóstico si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-validation-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
