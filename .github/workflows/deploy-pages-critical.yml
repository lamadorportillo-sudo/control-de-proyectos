name: Publicación crítica Control de Proyectos

on:
  push:
    branches:
      - main
    paths:
      - 'build-pages.cjs'
      - 'authenticated-module-manifest-v1.cjs'
      - 'inject-portfolio.cjs'
      - 'patch-session-security.cjs'
      - 'patch-offline-field.cjs'
      - 'stabilize-core-v1.cjs'
      - 'manifest.webmanifest'
      - 'netlify.toml'
      - '*.js'
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'assets/formats/**'
      - 'supabase/**'
      - 'frontend-v2/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/deploy-pages-critical.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-proyectos-publicacion-main
  cancel-in-progress: true

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validación básica de archivos
        shell: bash
        run: |
          set -euo pipefail
          node --check authenticated-module-manifest-v1.cjs
          node --check build-pages.cjs
          node --check inject-portfolio.cjs
          node --check patch-session-security.cjs
          node --check patch-offline-field.cjs
          node --check stabilize-core-v1.cjs
          node --check tests/startup-responsive.spec.cjs
          node --check tests/project-create-route-responsive.spec.cjs
          node --test tests/core-stability-regressions.test.cjs tests/ui-tabs-functional.test.cjs tests/ui-contrast-final-guard.test.cjs

      - name: Preparar interfaz anterior para comprobaciones
        shell: bash
        run: |
          set -euo pipefail
          if [ -s legacy.html ]; then
            cp legacy.html index.html
          fi

      - name: Reconstruir y estabilizar aplicación
        run: |
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          node stabilize-core-v1.cjs
          node patch-offline-field.cjs

      - name: Construir interfaz V2 paralela
        shell: bash
        run: |
          set -euo pipefail
          cd frontend-v2
          npm install --no-package-lock
          npm run lint
          npm run build
          cd ..
          rm -rf v2
          mkdir -p v2
          cp -R frontend-v2/dist/. v2/

      - name: Confirmar V2 paralela
        shell: bash
        run: |
          set -euo pipefail
          test -s v2/index.html
          test -d v2/assets
          grep -q 'Control Contractual' v2/index.html

      - name: Confirmar página generada
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          node scripts/validate-auth-manifest.cjs
          grep -q 'data-cc-auth-script' index.html
          grep -q 'data-cc-auth-loader data-cc-auth-plan' index.html
          grep -q '</html>' index.html
          if grep -q 'document.write(' index.html; then
            echo 'Reapareció document.write en el HTML publicado.' >&2
            exit 1
          fi

      - name: Instalar navegador de prueba
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Levantar artefacto generado
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/control-proyectos-critical-http.log 2>&1 &
          echo $! > /tmp/control-proyectos-critical-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/control-proyectos-critical-http.log
          exit 1

      - name: Probar arranque en PC y celular
        env:
          APP_URL: http://127.0.0.1:4173/
        shell: bash
        run: timeout 120s npx playwright test tests/startup-responsive.spec.cjs --workers=1 --retries=0

      - name: Guardar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publicacion-critica-diagnostico
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Probar alta directa de proyecto y navegación
        env:
          APP_URL: http://127.0.0.1:4173/
        shell: bash
        run: |
          timeout 90s npx playwright test tests/project-create-route-responsive.spec.cjs --workers=1 --retries=0
          timeout 120s npx playwright test tests/navigation-centers-responsive.spec.cjs --workers=1 --retries=0

      - name: Preparar V2 como interfaz principal y conservar respaldo
        shell: bash
        run: |
          set -euo pipefail
          cp index.html legacy.html
          cp frontend-v2/dist/index.html index.html
          mkdir -p assets
          cp -R frontend-v2/dist/assets/. assets/
          test -s legacy.html
          test -s index.html
          grep -q 'Control Contractual' index.html

      - name: Probar V2 desde la raíz publicada
        env:
          FRONTEND_V2_URL: http://127.0.0.1:4173/
        shell: bash
        run: timeout 180s npx playwright test tests/frontend-v2-session-bridge-responsive.spec.cjs --workers=1 --retries=0

      - name: Publicar después de las comprobaciones básicas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- index.html legacy.html assets/ v2/)" ]; then
            echo "Interfaz principal V2 y respaldo ya están actualizados."
          else
            git add index.html legacy.html assets/ v2/
            git commit -m "Publicar V2 principal y conservar interfaz anterior"
            git push origin HEAD:main
          fi
