name: Publicación crítica Control de Proyectos

on:
  push:
    branches:
      - main
    paths:
      - 'build-pages.cjs'
      - 'authenticated-module-manifest-v1.cjs'
      - 'inject-portfolio.cjs'
      - 'patch-session-security.cjs'
      - 'patch-offline-field.cjs'
      - 'stabilize-core-v1.cjs'
      - 'manifest.webmanifest'
      - 'netlify.toml'
      - '*.js'
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'assets/formats/**'
      - 'supabase/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/deploy-pages-critical.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-proyectos-publicacion-main
  cancel-in-progress: true

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validación básica de archivos
        shell: bash
        run: |
          set -euo pipefail
          node --check authenticated-module-manifest-v1.cjs
          node --check build-pages.cjs
          node --check inject-portfolio.cjs
          node --check patch-session-security.cjs
          node --check patch-offline-field.cjs
          node --check stabilize-core-v1.cjs
          node --check tests/startup-responsive.spec.cjs
          node --check tests/project-create-route-responsive.spec.cjs
          node --test tests/core-stability-regressions.test.cjs tests/ui-tabs-functional.test.cjs tests/ui-contrast-final-guard.test.cjs

      - name: Reconstruir y estabilizar aplicación
        run: |
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          node stabilize-core-v1.cjs
          node patch-offline-field.cjs

      - name: Confirmar página generada
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          node scripts/validate-auth-manifest.cjs
          grep -q 'data-cc-auth-script' index.html
          grep -q 'data-cc-auth-loader data-cc-auth-plan' index.html
          grep -q '</html>' index.html
          if grep -q 'document.write(' index.html; then
            echo 'Reapareció document.write en el HTML publicado.' >&2
            exit 1
          fi

      - name: Instalar navegador de prueba
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Levantar artefacto generado
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/control-proyectos-critical-http.log 2>&1 &
          echo $! > /tmp/control-proyectos-critical-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/control-proyectos-critical-http.log
          exit 1

      - name: Probar arranque en PC y celular
        env:
          APP_URL: http://127.0.0.1:4173/
        shell: bash
        run: timeout 120s npx playwright test tests/startup-responsive.spec.cjs --workers=1 --retries=0

      - name: Guardar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publicacion-critica-diagnostico
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Probar alta directa de proyecto y navegación
        env:
          APP_URL: http://127.0.0.1:4173/
        shell: bash
        run: timeout 90s npx playwright test tests/project-create-route-responsive.spec.cjs --workers=1 --retries=0

      - name: Publicar después de las comprobaciones básicas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html ya está actualizado."
          else
            git add index.html
            git commit -m "Publicar interfaz estabilizada por recorrido real"
            git push origin HEAD:main
          fi
