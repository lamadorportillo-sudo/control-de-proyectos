name: Publicación crítica Control de Proyectos

on:
  push:
    branches:
      - main
    paths:
      - 'build-pages.cjs'
      - 'authenticated-module-manifest-v1.cjs'
      - 'inject-portfolio.cjs'
      - 'patch-session-security.cjs'
      - 'stabilize-core-v1.cjs'
      - '*.js'
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'assets/formats/**'
      - 'supabase/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/deploy-pages-critical.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-proyectos-publicacion-main
  cancel-in-progress: true

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validar fuente y pruebas unitarias
        shell: bash
        run: |
          set -euo pipefail
          for f in ./*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
          node --check authenticated-module-manifest-v1.cjs
          node --check build-pages.cjs
          node --check inject-portfolio.cjs
          node --check patch-session-security.cjs
          node --check stabilize-core-v1.cjs
          node --check scripts/audit-system-1000.cjs
          node --check tests/full-user-journey-responsive.spec.cjs
          node --check tests/project-create-route-responsive.spec.cjs
          node --test tests/*.test.cjs

      - name: Reconstruir y estabilizar aplicación
        run: |
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          node stabilize-core-v1.cjs

      - name: Forzar solo versiones aún no centralizadas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          replacements = [
              (r'performance-runtime-v1\.js\?v[^\"\']*', 'performance-runtime-v1.js?v=20260904-perf10', 'performance-runtime-v1.js'),
              (r'project-tabs-complete-v1\.js\?v[^\"\']*', 'project-tabs-complete-v1.js?v=20260831-tabscomplete34', 'project-tabs-complete-v1.js'),
              (r'admin-users-v1\.js\?v[^\"\']*', 'admin-users-v1.js?v=20260823-admin-users4', 'admin-users-v1.js'),
              (r'adaptive-chat-learning-v1\.js\?v[^\"\']*', 'adaptive-chat-learning-v1.js?v=20260824-zordon2', 'adaptive-chat-learning-v1.js'),
              (r'ui-navigation-single-source-v1\.js\?v[^\"\']*', 'ui-navigation-single-source-v1.js?v=20260903-singlenav2', 'ui-navigation-single-source-v1.js'),
          ]
          for pattern, replacement, label in replacements:
              html, count = re.subn(pattern, replacement, html)
              if count == 0:
                  raise SystemExit(f'No se encontró {label} para renovar su versión.')

          # private-access y password-recovery ya toman su versión del manifiesto
          # canónico durante build-pages; el workflow no debe sobrescribirlas.
          if 'private-access-v1.js?v=20260904-private6' not in html:
              raise SystemExit('El artefacto no conserva la versión canónica de private-access-v1.js.')

          loader_marker = '<script data-cc-auth-loader data-cc-auth-plan>'
          if loader_marker not in html:
              raise SystemExit('Se perdió el cargador autenticado secuencial de módulos.')

          # ZORDON aún no forma parte del paquete histórico reconstruido. Se
          # conserva dentro del plan autenticado, nunca en la pantalla de acceso.
          for name in ('zordon-continuous-runtime-v1.js','zordon-chat-ui-v1.js','zordon-send-hardfix-v1.js'):
              html = re.sub(r'<script\s+src=["\']'+re.escape(name)+r'(?:\?[^"\']*)?["\']\s*></script>\s*', '', html, flags=re.I)
              html = re.sub(r'<script[^>]*data-cc-auth-script[^>]*data-src=["\'][^"\']*'+re.escape(name)+r'[^"\']*["\'][^>]*></script>\s*', '', html, flags=re.I)

          zordon = '<script type="application/x-cc-auth" data-cc-auth-script data-src="zordon-continuous-runtime-v1.js?v=20260824-zordon4"></script>'
          chat = '<script type="application/x-cc-auth" data-cc-auth-script data-src="zordon-chat-ui-v1.js?v=20260824-cleanchat4"></script>'
          html = html.replace(loader_marker, zordon + '\n' + chat + '\n' + loader_marker, 1)

          if 'document.write(' in html:
              raise SystemExit('Reapareció document.write en el artefacto autenticado.')
          path.write_text(html, encoding='utf-8')
          PY

      - name: Validar artefacto crítico
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s performance-runtime-v1.js
          test -s portal-web-v2.js
          test -s dashboard-simplified-v4.js
          test -s service-worker-v1.js
          test -s ui-stability-v1.js
          test -s ui-navigation-single-source-v1.js
          grep -q 'NUCLEO DE INTEGRIDAD Y CONCURRENCIA V1' index.html
          grep -q 'STARTUP_TIMEOUT_MS=12000' index.html
          grep -q 'startupDeadline' index.html
          grep -q 'Abriendo tu espacio de trabajo' index.html
          grep -q 'save_app_state' index.html
          grep -q 'performance-runtime-v1.js?v=20260904-perf10' index.html
          grep -q 'COORDINADOR DE RENDIMIENTO DEL DOM V6' performance-runtime-v1.js
          grep -q 'portal-web-v2.js?v=20260904-web4' performance-runtime-v1.js
          grep -q 'dashboard-simplified-v4.js?v=20260903-dash6' performance-runtime-v1.js
          grep -q 'service-worker-v1.js?v=20260903-sw2' performance-runtime-v1.js
          grep -q 'ui-stability-v1.js?v=20260904-stable2' performance-runtime-v1.js
          grep -q 'cc-static-v1-20260903-recovery-v2' service-worker-v1.js
          grep -q 'PORTAL WEB V4 · PRESENTACIÓN ESTABLE' portal-web-v2.js
          grep -q 'Inicio, Proyectos, Presupuesto y centros globales quedan sin listener local' portal-web-v2.js
          grep -q 'DASHBOARD SIMPLIFICADO V6 · ESTABLE' dashboard-simplified-v4.js
          grep -q 'ESTABILIDAD VISUAL V2' ui-stability-v1.js
          grep -q 'project-tabs-complete-v1.js?v=20260831-tabscomplete34' index.html
          grep -q 'private-access-v1.js?v=20260904-private6' index.html
          grep -q '20260904-private6' authenticated-module-manifest-v1.cjs
          grep -q 'ui-navigation-single-source-v1.js?v=20260903-singlenav2' index.html
          grep -q 'zordon-continuous-runtime-v1.js?v=20260824-zordon4' index.html
          grep -q 'zordon-chat-ui-v1.js?v=20260824-cleanchat4' index.html
          grep -q 'data-cc-auth-script' index.html
          grep -q 'data-cc-auth-loader data-cc-auth-plan' index.html
          grep -q '__CC_AUTH_BOOT_FAILED__' index.html
          grep -q '__CC_AUTH_MODULE_ERRORS__' index.html
          grep -q 'authenticated-modules-partial' index.html
          grep -q "control_contractual_session_v3" index.html
          grep -q "view.screen='project';view.tab='summary'" index.html
          grep -q "const targetPct=Number(contract.recoveryTarget||0);" index.html
          grep -q 'Sincronización con Supabase en curso' index.html
          grep -q '</html>' index.html
          for retired in system-ui-refinement-v2.js dashboard-executive-v1.js home-executive-fix-v2.js industrial-home-v1.js portfolio-redesign-v1.js project-portfolio-detail-v1.js portfolio-screen-fix-v1.js; do
            if grep -q "$retired" index.html; then
              echo "Sigue cargada capa retirada: $retired" >&2
              exit 1
            fi
          done
          if grep -q 'document.write(' index.html; then
            echo 'Reapareció document.write en el HTML publicado.' >&2
            exit 1
          fi
          if grep -q 'window.__CP_B64=' index.html; then
            echo 'El HTML generado todavía contiene el cargador Base64.' >&2
            exit 1
          fi

      - name: Ejecutar más de mil comprobaciones de integridad
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-system-1000.cjs

      - name: Instalar navegador de prueba
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Levantar artefacto generado
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/control-proyectos-critical-http.log 2>&1 &
          echo $! > /tmp/control-proyectos-critical-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/control-proyectos-critical-http.log
          exit 1

      - name: Probar arranque y recuperación de nube
        env:
          APP_URL: http://127.0.0.1:4173/
        shell: bash
        run: timeout 120s npx playwright test tests/startup-responsive.spec.cjs --workers=1 --retries=0

      - name: Probar ingreso desde cero y expediente completo
        env:
          APP_URL: http://127.0.0.1:4173/
        shell: bash
        run: timeout 180s npx playwright test tests/full-user-journey-responsive.spec.cjs --workers=1 --retries=0

      - name: Probar alta directa de proyecto y navegación
        env:
          APP_URL: http://127.0.0.1:4173/
        shell: bash
        run: timeout 90s npx playwright test tests/project-create-route-responsive.spec.cjs --workers=1 --retries=0

      # Regla de liberación: no se publica nada si cualquiera de las pruebas anteriores falla.
      - name: Publicar solo después de superar el recorrido real
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html ya está actualizado."
          else
            git add index.html
            git commit -m "Publicar interfaz estabilizada por recorrido real"
            git push origin HEAD:main
          fi
