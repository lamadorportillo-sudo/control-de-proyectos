name: Publicación crítica Control de Proyectos

on:
  push:
    branches:
      - main
    paths:
      - 'build-pages.cjs'
      - 'authenticated-module-manifest-v1.cjs'
      - 'inject-portfolio.cjs'
      - 'patch-session-security.cjs'
      - 'patch-offline-field.cjs'
      - 'stabilize-core-v1.cjs'
      - 'manifest.webmanifest'
      - 'netlify.toml'
      - '*.js'
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'assets/formats/**'
      - 'supabase/**'
      - 'frontend-v2/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/deploy-pages-critical.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-proyectos-publicacion-main
  cancel-in-progress: true

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias raíz
        run: npm install --no-package-lock

      - name: Validación básica de archivos
        shell: bash
        run: |
          set -euo pipefail
          node --check authenticated-module-manifest-v1.cjs
          node --check build-pages.cjs
          node --check inject-portfolio.cjs
          node --check patch-session-security.cjs
          node --check patch-offline-field.cjs
          node --check stabilize-core-v1.cjs
          node --check zordon-continuous-runtime-v1.js
          node --check zordon-presence-v4.js
          node --check tests/startup-responsive.spec.cjs
          node --check tests/project-create-route-responsive.spec.cjs
          node --test tests/core-stability-regressions.test.cjs tests/ui-tabs-functional.test.cjs tests/ui-contrast-final-guard.test.cjs

      - name: Preparar interfaz anterior para reconstrucción
        shell: bash
        run: |
          set -euo pipefail
          if [ -s legacy.html ]; then cp legacy.html index.html; fi

      - name: Reconstruir y estabilizar aplicación heredada
        run: |
          set -euo pipefail
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          node stabilize-core-v1.cjs
          node patch-offline-field.cjs

      - name: Validar index heredado generado
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          # Algunas reconstrucciones históricas no contienen el cargador de
          # autenticación moderno. En ese caso se valida la estructura y se
          # continúa: la interfaz V2 sustituirá este archivo más adelante.
          if grep -q 'data-cc-auth-script' index.html; then
            node scripts/validate-auth-manifest.cjs
            grep -q 'data-cc-auth-loader data-cc-auth-plan' index.html
          else
            echo 'Aviso: index heredado sin marcadores de auth modernos; se omite esa comprobación opcional.'
          fi
          if grep -q 'document.write(' index.html; then
            echo 'Reapareció document.write en el HTML publicado.' >&2
            exit 1
          fi

      - name: Construir interfaz V2 y copiar artefacto publicado
        working-directory: frontend-v2
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npm run lint
          npm run build
          test -s dist/index.html
          test -d dist/assets
          cd ..
          rm -rf v2
          mkdir -p v2
          cp -a frontend-v2/dist/. v2/
          test -s v2/index.html
          test -d v2/assets
          grep -q 'Control Contractual' v2/index.html

      - name: Preparar herramientas de prueba
        run: npm install --no-save --include=dev @playwright/test@1.55.0

      - name: Instalar dependencias raíz para pruebas
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock

      - name: Instalar navegador de prueba
        run: npx playwright install --with-deps chromium

      - name: Levantar servidor local de auditoría
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$ROOT" > /tmp/control-proyectos-critical-http.log 2>&1 &
          echo $! > /tmp/control-proyectos-critical-http.pid
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              echo "Servidor listo en http://127.0.0.1:4173/"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/control-proyectos-critical-http.log
          exit 1

      - name: Probar arranque en PC y celular
        env:
          APP_URL: http://127.0.0.1:4173/
        run: timeout 120s npx playwright test tests/startup-responsive.spec.cjs --workers=1 --retries=0

      - name: Probar alta directa y navegación
        env:
          APP_URL: http://127.0.0.1:4173/
        run: |
          timeout 90s npx playwright test tests/project-create-route-responsive.spec.cjs --workers=1 --retries=0
          timeout 120s npx playwright test tests/navigation-centers-responsive.spec.cjs --workers=1 --retries=0

      - name: Preparar V2 como interfaz principal
        shell: bash
        run: |
          set -euo pipefail
          cp index.html legacy.html
          cp frontend-v2/dist/index.html index.html
          rm -rf assets
          mkdir -p assets
          cp -a frontend-v2/dist/assets/. assets/
          test -s legacy.html
          test -s index.html
          grep -q 'Control Contractual' index.html

      - name: Probar V2 desde la raíz publicada
        env:
          FRONTEND_V2_URL: http://127.0.0.1:4173/
        run: timeout 180s npx playwright test tests/frontend-v2-session-bridge-responsive.spec.cjs --workers=1 --retries=0

      - name: Publicar artefactos generados en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain -- index.html legacy.html assets/ v2/)" ]; then
            echo 'Los artefactos publicados ya están actualizados.'
            exit 0
          fi
          git add index.html legacy.html assets/ v2/
          git commit -m 'Publicar V2 principal y conservar interfaz anterior'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'No se pudo publicar después de 3 intentos.' >&2
          exit 1
