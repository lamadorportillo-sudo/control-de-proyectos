name: Construir y publicar Control de Proyectos

on:
  push:
    branches:
      - main
    paths:
      - 'build-pages.cjs'
      - 'inject-portfolio.cjs'
      - 'patch-session-security.cjs'
      - '*.js'
      - 'supabase/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-proyectos-build-main
  cancel-in-progress: true

jobs:
  build-direct:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validar JavaScript fuente
        shell: bash
        run: |
          set -euo pipefail
          for f in ./*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
          node --check build-pages.cjs
          node --check inject-portfolio.cjs
          node --check patch-session-security.cjs

      - name: Reconstruir aplicación
        run: |
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs

      - name: Forzar versión de módulos críticos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          replacements = [
              (r'project-tabs-complete-v1\.js\?v[^\"\']*', 'project-tabs-complete-v1.js?v=20260824-tabscomplete26', 'project-tabs-complete-v1.js'),
              (r'private-access-v1\.js\?v[^\"\']*', 'private-access-v1.js?v=20260823-private5', 'private-access-v1.js'),
              (r'admin-users-v1\.js\?v[^\"\']*', 'admin-users-v1.js?v=20260823-admin-users4', 'admin-users-v1.js'),
              (r'adaptive-chat-learning-v1\.js\?v[^\"\']*', 'adaptive-chat-learning-v1.js?v=20260824-zordon2', 'adaptive-chat-learning-v1.js'),
          ]

          for pattern, replacement, label in replacements:
              html, count = re.subn(pattern, replacement, html)
              if count == 0:
                  raise SystemExit(f'No se encontró {label} para renovar su versión.')

          zordon_tag = '<script src="zordon-continuous-runtime-v1.js?v=20260824-zordon3"></script>'
          html = re.sub(r'<script\s+src=["\']zordon-continuous-runtime-v1\.js(?:\?[^"\']*)?["\']\s*></script>\s*', '', html, flags=re.I)
          pos = html.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('No se encontró </body> para cargar el núcleo continuo de ZORDON.')
          html = html[:pos] + zordon_tag + '\n' + html[pos:]

          path.write_text(html, encoding='utf-8')
          PY
          grep -q 'project-tabs-complete-v1.js?v=20260824-tabscomplete26' index.html
          grep -q 'private-access-v1.js?v=20260823-private5' index.html
          grep -q 'admin-users-v1.js?v=20260823-admin-users4' index.html
          grep -q 'adaptive-chat-learning-v1.js?v=20260824-zordon2' index.html
          grep -q 'zordon-continuous-runtime-v1.js?v=20260824-zordon3' index.html

      - name: Validar aplicación generada
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s home-executive-fix-v2.js
          test -s security-runtime-v1.js
          test -s security-center-v1.js
          test -s mfa-security-v1.js
          test -s engineering-manual-reference-v1.js
          test -s immersive-engineering-experience-v1.js
          test -s zordon-continuous-runtime-v1.js
          grep -q 'NUCLEO DE INTEGRIDAD Y CONCURRENCIA V1' index.html
          grep -q 'save_app_state' index.html
          grep -q 'portfolio-redesign-v1.js' index.html
          grep -q 'transparency-portal-v1.js' index.html
          grep -q 'project-portfolio-detail-v1.js' index.html
          grep -q 'portfolio-gallery-v1.js' index.html
          grep -q 'portfolio-screen-fix-v1.js' index.html
          grep -q 'project-photo-story-v1.js' index.html
          grep -q 'photo-gallery-polish-v2.js' index.html
          grep -q 'ui-theme-unifier-v1.js' index.html
          grep -q 'engineering-visibility-fix-v1.js' index.html
          grep -q 'ui-operational-polish-v1.js' index.html
          grep -q 'home-executive-fix-v2.js' project-tabs-complete-v1.js
          grep -q 'engineering-manual-reference-v1.js?v=20260823-manual2' project-tabs-complete-v1.js
          grep -q 'immersive-engineering-experience-v1.js?v=20260824-immersive1' project-tabs-complete-v1.js
          grep -q 'EXPERIENCIA DE INGENIERIA 3D V1' immersive-engineering-experience-v1.js
          grep -q 'NÚCLEO DE APRENDIZAJE CONTINUO V2' zordon-continuous-runtime-v1.js
          grep -q "mode='continuous'" zordon-continuous-runtime-v1.js
          grep -q 'ZORDON · Ingeniero Civil' zordon-continuous-runtime-v1.js
          grep -q 'REFERENCIA TECNICA DEL MANUAL DE INGENIERIA V2' engineering-manual-reference-v1.js
          grep -q 'Manual técnico' engineering-manual-reference-v1.js
          grep -q '150 páginas' engineering-manual-reference-v1.js
          grep -q 'jurisdictionNote' engineering-manual-reference-v1.js
          grep -q 'security-runtime-v1.js?v=20260823-security3' project-tabs-complete-v1.js
          grep -q 'mfa-security-v1.js?v=20260824-mfa4' project-tabs-complete-v1.js
          grep -q 'security-center-v1.js?v=20260823-securitycenter4' project-tabs-complete-v1.js
          grep -q 'ui-visibility-audit-v1.js' index.html
          grep -q 'functions/v1/secure-mfa' private-access-v1.js
          grep -q 'mfa_enrollment_required' private-access-v1.js
          grep -q 'complete_login:true' private-access-v1.js
          grep -q 'Recuperar 2FA' admin-users-v1.js
          grep -q "securitySessionId:priorSession.securitySessionId||''" index.html
          grep -q "deviceLabel:priorSession.deviceLabel||''" index.html
          grep -q "cache:'no-store'" index.html
          grep -q 'project-tabs-complete-v1.js?v=20260824-tabscomplete26' index.html
          grep -q 'private-access-v1.js?v=20260823-private5' index.html
          grep -q 'admin-users-v1.js?v=20260823-admin-users4' index.html
          grep -q 'adaptive-chat-learning-v1.js?v=20260824-zordon2' index.html
          grep -q 'zordon-continuous-runtime-v1.js?v=20260824-zordon3' index.html
          grep -q '</html>' index.html
          if grep -q 'window.__CP_B64=' index.html; then
            echo 'El HTML generado todavía contiene el cargador Base64.' >&2
            exit 1
          fi
          echo 'Aplicación generada, ZORDON conversacional V2, aprendizaje continuo, experiencia 3D, Manual técnico, caché local, renovación de token, accesos, 2FA administrativa y seguridad verificados.'

      - name: Publicar index.html en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html ya está actualizado."
          else
            git add index.html
            git commit -m "Publicar interfaz contractual renovada [skip ci]"
            git push origin HEAD:main
          fi
