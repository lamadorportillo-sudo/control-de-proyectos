name: Reparar y publicar Control de Proyectos

on:
  push:
    branches:
      - main
    paths:
      - 'build-pages.cjs'
      - 'bundle-*.js'
      - 'estimate-scanner-v1.js'
      - 'adaptive-learning-v1.js'
      - 'contract-lifecycle-v1.js'
      - 'search-display-fix.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-direct:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Reconstruir, reparar y validar HTML
        run: node build-pages.cjs

      - name: Validar ciclo contractual
        run: node --check contract-lifecycle-v1.js

      - name: Integrar ciclo contractual LCE-RLCE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html_path = Path('index.html')
          js_path = Path('contract-lifecycle-v1.js')
          html = html_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')
          marker = '/* ===== CICLO CONTRACTUAL LCE/RLCE V1 ===== */'
          new_block = '<script>\n' + js + '\n</script>'

          marker_pos = html.find(marker)
          if marker_pos >= 0:
              block_start = html.rfind('<script', 0, marker_pos)
              block_end = html.find('</script>', marker_pos)
              if block_start < 0 or block_end < 0:
                  raise SystemExit('No se pudo localizar el bloque contractual existente')
              block_end += len('</script>')
              html = html[:block_start] + new_block + html[block_end:]
              print('Ciclo contractual actualizado en index.html')
          else:
              pos = html.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('No se encontró </body> en index.html')
              html = html[:pos] + new_block + '\n' + html[pos:]
              print('Ciclo contractual integrado en index.html')

          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Integrar corrección de búsqueda
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html_path = Path('index.html')
          js = Path('search-display-fix.js').read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')
          marker = '/* ===== PROJECT SEARCH DISPLAY FIX V1 ===== */'
          new_block = '<script>\n' + js + '\n</script>'
          marker_pos = html.find(marker)
          if marker_pos >= 0:
              block_start = html.rfind('<script', 0, marker_pos)
              block_end = html.find('</script>', marker_pos)
              if block_start < 0 or block_end < 0:
                  raise SystemExit('No se pudo localizar la corrección del buscador')
              block_end += len('</script>')
              html = html[:block_start] + new_block + html[block_end:]
          else:
              pos = html.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('No se encontró </body> en index.html')
              html = html[:pos] + new_block + '\n' + html[pos:]
          html_path.write_text(html, encoding='utf-8')
          print('Corrección del buscador integrada en index.html')
          PY

      - name: Guardar index.html directo en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html ya está actualizado."
          else
            git add index.html
            git commit -m "Publicar HTML directo reparado [skip ci]"
            git push origin HEAD:main
          fi
