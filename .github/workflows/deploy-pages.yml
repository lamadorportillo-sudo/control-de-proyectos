name: Reparar y publicar Control de Proyectos

on:
  push:
    branches:
      - main
    paths:
      - 'build-pages.cjs'
      - 'bundle-*.js'
      - 'estimate-scanner-v1.js'
      - 'adaptive-learning-v1.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-direct:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Reconstruir, reparar y validar HTML
        run: node build-pages.cjs

      - name: Guardar index.html directo en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html ya está actualizado."
          else
            git add index.html
            git commit -m "Publicar HTML directo reparado [skip ci]"
            git push origin HEAD:main
          fi
