name: Construir y publicar Control de Proyectos

on:
  push:
    branches:
      - main
    paths:
      - 'build-pages.cjs'
      - '*.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-proyectos-build-main
  cancel-in-progress: true

jobs:
  build-direct:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validar JavaScript fuente
        shell: bash
        run: |
          set -euo pipefail
          for f in ./*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
          node --check build-pages.cjs

      - name: Reconstruir aplicación
        run: node build-pages.cjs

      - name: Validar aplicación generada
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'NUCLEO DE INTEGRIDAD Y CONCURRENCIA V1' index.html
          grep -q 'save_app_state' index.html
          grep -q '</html>' index.html
          if grep -q 'window.__CP_B64=' index.html; then
            echo 'El HTML generado todavía contiene el cargador Base64.' >&2
            exit 1
          fi
          echo 'Aplicación generada y núcleo contractual verificado.'

      - name: Publicar index.html en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html ya está actualizado."
          else
            git add index.html
            git commit -m "Publicar núcleo contractual endurecido [skip ci]"
            git push origin HEAD:main
          fi
