name: Auditoría completa manual de Control de Proyectos

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-proyectos-auditoria-manual
  cancel-in-progress: true

jobs:
  audit-full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validar JavaScript fuente
        shell: bash
        run: |
          set -euo pipefail
          for f in ./*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
          node --check build-pages.cjs
          node --check inject-portfolio.cjs
          node --check patch-session-security.cjs
          node --check stabilize-core-v1.cjs
          node --test tests/*.test.cjs

      - name: Reconstruir aplicación para auditoría
        run: |
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          node stabilize-core-v1.cjs

      - name: Instalar dependencias de navegador
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Levantar artefacto generado
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/control-proyectos-audit-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/control-proyectos-audit-http.log
          exit 1

      - name: Ejecutar auditoría responsive completa
        env:
          APP_URL: http://127.0.0.1:4173/
        run: npx playwright test
