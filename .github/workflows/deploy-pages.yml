name: Publicar Control de Proyectos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Reconstruir y validar aplicación
        run: node build-pages.cjs

      - name: Subir sitio generado
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
