name: Reparar y publicar Control de Proyectos

on:
  push:
    branches:
      - main
    paths:
      - 'build-pages.cjs'
      - 'bundle-*.js'
      - 'estimate-scanner-v1.js'
      - 'adaptive-learning-v1.js'
      - 'contract-lifecycle-v1.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-direct:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Reconstruir, reparar y validar HTML
        run: node build-pages.cjs

      - name: Validar ciclo contractual
        run: node --check contract-lifecycle-v1.js

      - name: Integrar ciclo contractual LCE-RLCE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html_path = Path('index.html')
          js_path = Path('contract-lifecycle-v1.js')
          html = html_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')
          marker = '/* ===== CICLO CONTRACTUAL LCE/RLCE V1 ===== */'
          if marker not in html:
              pos = html.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('No se encontró </body> en index.html')
              html = html[:pos] + '<script>\n' + js + '\n</script>\n' + html[pos:]
              html_path.write_text(html, encoding='utf-8')
              print('Ciclo contractual integrado en index.html')
          else:
              print('Ciclo contractual ya integrado')
          PY

      - name: Guardar index.html directo en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html ya está actualizado."
          else
            git add index.html
            git commit -m "Publicar HTML directo reparado [skip ci]"
            git push origin HEAD:main
          fi
