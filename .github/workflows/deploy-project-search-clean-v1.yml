name: Publicar buscador limpio de proyectos

on:
  push:
    branches: [main]
    paths:
      - 'project-search-clean-v1.js'
      - '.github/workflows/deploy-project-search-clean-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-contractual-project-search-clean
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Validar módulo
        run: node --check project-search-clean-v1.js

      - name: Integrar módulo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          module='project-search-clean-v1.js';version='20260820-searchclean1'
          index=Path('index.html');html=index.read_text(encoding='utf-8')
          html=re.sub(r'<script\s+src=["\']'+re.escape(module)+r'(?:\?[^"\']*)?["\']\s*></script>\s*','',html,flags=re.I)
          pos=html.lower().rfind('</body>')
          if pos<0: raise SystemExit('No se encontró </body>.')
          html=html[:pos]+f'<script src="{module}?v={version}"></script>\n'+html[pos:]
          index.write_text(html,encoding='utf-8')

          build=Path('build-pages.cjs');src=build.read_text(encoding='utf-8')
          src=re.sub(r"\s*\['project-search-clean-v1\.js','[^']+'\],?",'',src)
          anchor="  ['summary-budget-law-v1.js','20260820-summarybudgetlaw1'],"
          if anchor not in src: raise SystemExit('No se encontró ancla del build.')
          src=src.replace(anchor,anchor+"\n  ['project-search-clean-v1.js','20260820-searchclean1'],")
          build.write_text(src,encoding='utf-8')
          PY

      - name: Validar build
        run: node --check build-pages.cjs

      - name: Guardar integración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html build-pages.cjs; then
            echo "Sin cambios."
          else
            git add index.html build-pages.cjs
            git commit -m "Integrar buscador limpio de proyectos [skip ci]"
            git push origin HEAD:main
          fi
