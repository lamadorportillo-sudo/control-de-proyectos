name: Publicar impresión profesional de visitas

on:
  push:
    branches:
      - main
    paths:
      - 'visit-print-v1.js'
      - '.github/workflows/deploy-visit-print.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: control-contractual-visit-print
  cancel-in-progress: true

jobs:
  integrate-visit-print:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validar módulo de impresión
        run: node --check visit-print-v1.js

      - name: Integrar módulo y conservarlo en futuras compilaciones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          module = 'visit-print-v1.js'
          version = '20260820-visitprint1'

          # 1) Integrar en la página publicada.
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'<script\s+src=["\']visit-print-v1\.js(?:\?[^"\']*)?["\']\s*></script>\s*', '', html, flags=re.I)
          pos = html.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('No se encontró </body> en index.html')
          html = html[:pos] + f'<script src="{module}?v={version}"></script>\n' + html[pos:]
          index.write_text(html, encoding='utf-8')

          # 2) Conservar el módulo cuando build-pages.cjs reconstruya index.html.
          build = Path('build-pages.cjs')
          src = build.read_text(encoding='utf-8')
          entry = f"  ['{module}','{version}']"
          if entry not in src:
              anchor = "  ['award-notices-v1.js','20260820-notes1']"
              if anchor not in src:
                  raise SystemExit('No se encontró el punto de integración de módulos tardíos.')
              src = src.replace(anchor, anchor + ',\n' + entry)
              build.write_text(src, encoding='utf-8')

          print('Impresión profesional de visitas integrada y protegida para futuras compilaciones.')
          PY

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html build-pages.cjs; then
            echo "La impresión de visitas ya estaba integrada."
          else
            git add index.html build-pages.cjs
            git commit -m "Integrar impresión profesional de visitas [skip ci]"
            git push origin HEAD:main
          fi
