name: Integrar alertas compactas

on:
  push:
    branches:
      - main
    paths:
      - 'alerts-compact-v1.js'
      - '.github/workflows/integrate-alerts-compact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validar módulo de alertas compactas
        run: node --check alerts-compact-v1.js

      - name: Integrar módulo en index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="alerts-compact-v1.js?v=20260819a"></script>'

          pattern = r'<script\s+src=["\']alerts-compact-v1\.js(?:\?[^"\']*)?["\']\s*></script>'
          if re.search(pattern, html, flags=re.I):
              html = re.sub(pattern, tag, html, flags=re.I)
              print('Referencia de alertas compactas actualizada.')
          else:
              pos = html.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('No se encontró </body> en index.html')
              html = html[:pos] + tag + '\n' + html[pos:]
              print('Módulo de alertas compactas integrado.')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Guardar integración en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html ya contiene el módulo."
          else
            git add index.html
            git commit -m "Integrar alertas compactas en Control Contractual [skip ci]"
            git push origin HEAD:main
          fi
