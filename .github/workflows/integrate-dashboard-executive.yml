name: Integrar arquitectura ejecutiva

on:
  push:
    branches: [main]
    paths:
      - 'dashboard-executive-v1.js'
      - 'workspace-access-v1.js'
      - 'index.html'
      - 'build-pages.cjs'
      - '.github/workflows/integrate-dashboard-executive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Validar módulos
        run: |
          node --check workspace-access-v1.js
          node --check dashboard-executive-v1.js
      - name: Integrar acceso y arquitectura maestra
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          for module in ['workspace-access-v1.js','dashboard-executive-v1.js']:
              html=re.sub(r'\n?<script\s+src=["\']'+re.escape(module)+r'(?:\?[^"\']*)?["\']\s*></script>', '', html, flags=re.I)
          pos=html.lower().rfind('</body>')
          if pos<0:
              raise SystemExit('No se encontró </body>')
          block=(
              '<script src="workspace-access-v1.js?v=20260820-master"></script>\n'
              '<script src="dashboard-executive-v1.js?v=20260820-master"></script>\n'
          )
          html=html[:pos]+block+html[pos:]
          p.write_text(html,encoding='utf-8')
          print('Arquitectura ejecutiva maestra integrada.')
          PY
      - name: Publicar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html ya contiene la arquitectura ejecutiva."
          else
            git add index.html
            git commit -m "Integrar arquitectura ejecutiva maestra [skip ci]"
            git push origin HEAD:main
          fi
