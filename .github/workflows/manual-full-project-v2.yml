name: Expediente inventado completo

on:
  push:
    branches: [main]
    paths:
      - 'tests/manual-full-project-responsive.spec.cjs'
      - 'tests/core-stability-regressions.test.cjs'
      - 'stabilize-core-v1.cjs'
      - 'inject-portfolio.cjs'
      - 'ui-navigation-single-source-v1.js'
      - 'performance-runtime-v1.js'
      - 'storage-quota-fix-v1.js'
      - 'contract-official-format-v1.js'
      - 'contract-payment-documents-v1.js'
      - '.github/workflows/manual-full-project-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-full-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-full:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Reconstruir la aplicación real
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/manual-full-project-responsive.spec.cjs
          node --check tests/core-stability-regressions.test.cjs
          node --check stabilize-core-v1.cjs
          node --test tests/core-stability-regressions.test.cjs
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          node stabilize-core-v1.cjs
          grep -q "view.screen='project';view.tab='summary'" index.html
          grep -q "const targetPct=Number(contract.recoveryTarget||0);" index.html
      - name: Instalar navegador
        shell: bash
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium
      - name: Servir aplicación
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/manual-full-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/manual-full-http.log
          exit 1
      - name: Capturar expediente manual completo
        env:
          APP_URL: http://127.0.0.1:4173/
        run: npx playwright test tests/manual-full-project-responsive.spec.cjs --workers=1 --retries=0
      - name: Guardar evidencia y métricas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expediente-inventado-evidencia
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
