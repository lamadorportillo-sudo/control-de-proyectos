name: Auditoría responsive PC tablet celular

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '*.js'
      - '*.cjs'
      - 'tests/**'
      - 'supabase/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/responsive-audit.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validar sintaxis y pruebas estructurales existentes
        shell: bash
        run: |
          set -euo pipefail
          : > validation.log
          exec > >(tee -a validation.log) 2>&1
          echo '=== VALIDACIÓN JAVASCRIPT ==='
          for f in ./*.js; do
            [ -f "$f" ] || continue
            echo "[node --check] $f"
            node --check "$f"
          done
          echo '[node --check] build-pages.cjs'
          node --check build-pages.cjs
          echo '[node --check] inject-portfolio.cjs'
          node --check inject-portfolio.cjs
          echo '[node --check] patch-session-security.cjs'
          node --check patch-session-security.cjs
          echo '[node --check] stabilize-core-v1.cjs'
          node --check stabilize-core-v1.cjs
          echo '[node --check] playwright.config.cjs'
          node --check playwright.config.cjs
          echo '=== PRUEBAS ESTRUCTURALES ==='
          node --test tests/*.test.cjs

      - name: Reconstruir la interfaz exacta que se auditará
        shell: bash
        run: |
          set -euo pipefail
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          node stabilize-core-v1.cjs
          grep -q 'system-ui-refinement-v3.js' index.html
          grep -q 'integrity-diagnostics-v1.js' index.html
          grep -q 'ui-navigation-single-source-v1.js?v=20260904-singlenav3' index.html
          grep -q "view.screen='project';view.tab='summary'" index.html
          grep -q "const targetPct=Number(contract.recoveryTarget||0);" index.html
          for retired in system-ui-refinement-v2.js dashboard-executive-v1.js home-executive-fix-v2.js portfolio-redesign-v1.js project-portfolio-detail-v1.js portfolio-screen-fix-v1.js; do
            if grep -q "$retired" index.html; then
              echo "La capa redundante $retired todavía está cargada." >&2
              exit 1
            fi
          done
          grep -q '</html>' index.html

      - name: Instalar dependencias de auditoría
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Levantar aplicación local
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/control-proyectos-http.log 2>&1 &
          echo $! > /tmp/control-proyectos-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/control-proyectos-http.log
          exit 1

      - name: Diagnosticar bloqueo de Contrato
        continue-on-error: true
        shell: bash
        env:
          APP_URL: http://127.0.0.1:4173/
        run: |
          set -o pipefail
          npx playwright test tests/00-contract-observer-diagnostic.spec.cjs --workers=1 --retries=0 --max-failures=1 2>&1 | tee contract-diagnostic.log

      - name: Reproducir prueba móvil exacta en navegador limpio
        continue-on-error: true
        shell: bash
        env:
          APP_URL: http://127.0.0.1:4173/
        run: |
          set -o pipefail
          npx playwright test tests/authenticated-contrast-responsive.spec.cjs --grep "contraste autenticado mobile" --workers=1 --retries=0 --max-failures=1 2>&1 | tee contract-mobile-exact.log

      - name: Probar acceso, invitado, expedientes, seguridad y accesibilidad
        env:
          APP_URL: http://127.0.0.1:4173/
        run: npx playwright test --workers=1 --retries=0 --max-failures=1

      - name: Guardar diagnóstico y reporte visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-report
          path: |
            validation.log
            contract-diagnostic.log
            contract-mobile-exact.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
