name: Auditoría responsive PC tablet celular

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '*.js'
      - '*.cjs'
      - 'tests/**'
      - 'supabase/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/responsive-audit.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validar sintaxis y pruebas estructurales existentes
        shell: bash
        run: |
          set -euo pipefail
          for f in ./*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
          node --check build-pages.cjs
          node --check inject-portfolio.cjs
          node --check patch-session-security.cjs
          node --check playwright.config.cjs
          node --test tests/*.test.cjs

      - name: Reconstruir la interfaz exacta que se auditará
        shell: bash
        run: |
          set -euo pipefail
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          grep -q 'guest-mode-v1.js' index.html
          grep -q 'ui-compact-elegance-v1.js' index.html
          grep -q 'system-ui-refinement-v2.js?v=20260825-system2' index.html
          grep -q '</html>' index.html

      - name: Instalar Playwright
        shell: bash
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Levantar aplicación local
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/control-proyectos-http.log 2>&1 &
          echo $! > /tmp/control-proyectos-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/control-proyectos-http.log
          exit 1

      - name: Probar acceso público, modo invitado, expediente y panel de seguridad
        env:
          APP_URL: http://127.0.0.1:4173/
        run: npx playwright test

      - name: Guardar reporte visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
