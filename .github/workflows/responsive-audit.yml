name: Auditoría responsive PC tablet celular

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '*.js'
      - '*.cjs'
      - 'tests/**'
      - 'supabase/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/responsive-audit.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validar sintaxis y pruebas estructurales existentes
        shell: bash
        run: |
          set -euo pipefail
          : > validation.log
          exec > >(tee -a validation.log) 2>&1
          echo '=== VALIDACIÓN JAVASCRIPT ==='
          for f in ./*.js; do
            [ -f "$f" ] || continue
            echo "[node --check] $f"
            node --check "$f"
          done
          echo '[node --check] authenticated-module-manifest-v1.cjs'
          node --check authenticated-module-manifest-v1.cjs
          echo '[node --check] build-pages.cjs'
          node --check build-pages.cjs
          echo '[node --check] inject-portfolio.cjs'
          node --check inject-portfolio.cjs
          echo '[node --check] patch-session-security.cjs'
          node --check patch-session-security.cjs
          echo '[node --check] stabilize-core-v1.cjs'
          node --check stabilize-core-v1.cjs
          echo '[node --check] playwright.config.cjs'
          node --check playwright.config.cjs
          echo '=== PRUEBAS ESTRUCTURALES ==='
          node --test tests/*.test.cjs
          grep -q 'NAVEGACIÓN ÚNICA V6 · SIN DOBLE DESPLAZAMIENTO' ui-navigation-single-source-v1.js
          grep -q 'PERMISOS E IDIOMA V6 · RESOLUCIÓN TARDÍA SEGURA' technical-control-permissions-v1.js
          grep -q 'REFINAMIENTO GENERAL DE INTERFAZ V5 · OBSERVADOR ESTABLE' system-ui-refinement-v3.js
          grep -q 'ZORDON · NÚCLEO DE APRENDIZAJE CONTINUO V4 · IDÉMPOTENTE' zordon-continuous-runtime-v1.js
          grep -q 'BUSCADOR INTELIGENTE DE PROYECTOS V5 · LISTA ESTABLE' zordon-project-search-v1.js
          grep -q 'ZORDON · DENSIDAD UNIFICADA DE INTERFAZ V1' zordon-unified-density-v1.js
          grep -q 'ZORDON · CHAT NATURAL Y CONTINUO V5 · EVENTOS AISLADOS' zordon-chat-ui-v1.js
          grep -q 'GUARDIA FINAL DE CONTRASTE V8' ui-contrast-final-guard-v1.js
          if grep -q 'setInterval(' zordon-continuous-runtime-v1.js; then
            echo 'ZORDON volvió a instalar un intervalo permanente de reescritura.' >&2
            exit 1
          fi
          if grep -q 'pointInside(' zordon-chat-ui-v1.js; then
            echo 'ZORDON volvió a capturar clics por coordenadas globales.' >&2
            exit 1
          fi
          if grep -q 'industrial-home-v1.js' zordon-project-search-v1.js; then
            echo 'El buscador ZORDON volvió a reactivar la portada industrial retirada.' >&2
            exit 1
          fi

      - name: Reconstruir la interfaz exacta que se auditará
        shell: bash
        run: |
          set -euo pipefail
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          node stabilize-core-v1.cjs
          test -s index.html
          grep -q 'system-ui-refinement-v3.js?v=20260905-system6' index.html
          grep -q 'integrity-diagnostics-v1.js' index.html
          grep -q 'private-access-v1.js?v=20260904-private6' index.html
          grep -q 'performance-runtime-v1.js?v=20260904-perf10' index.html
          grep -q 'project-tabs-complete-v1.js?v=20260831-tabscomplete34' index.html
          grep -q 'ui-navigation-single-source-v1.js?v=20260905-singlenav6' index.html
          grep -q 'technical-control-permissions-v1.js?v=20260905-controltecnicoperm6' index.html
          grep -q 'zordon-continuous-runtime-v1.js?v=20260905-zordon5' index.html
          grep -q 'zordon-project-search-v1.js?v=20260905-zordonsearch5' index.html
          grep -q 'zordon-unified-density-v1.js?v=20260905-density2' index.html
          grep -q 'zordon-chat-ui-v1.js?v=20260905-cleanchat5' index.html
          grep -q 'ui-contrast-final-guard-v1.js?v=20260905-contrast-final8' index.html
          grep -q 'data-cc-auth-loader data-cc-auth-plan' index.html
          grep -q '__CC_AUTH_BOOT_FAILED__' index.html
          grep -q "view.screen='project';view.tab='summary'" index.html
          grep -q "const targetPct=Number(contract.recoveryTarget||0);" index.html
          for retired in system-ui-refinement-v2.js dashboard-executive-v1.js home-executive-fix-v2.js industrial-home-v1.js portfolio-redesign-v1.js project-portfolio-detail-v1.js portfolio-screen-fix-v1.js; do
            if grep -q "$retired" index.html; then
              echo "La capa redundante $retired todavía está cargada." >&2
              exit 1
            fi
          done
          if grep -q 'document.write(' index.html; then
            echo 'Reapareció document.write en el artefacto auditado.' >&2
            exit 1
          fi
          grep -q '</html>' index.html

      - name: Instalar dependencias de auditoría
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Levantar aplicación local
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/control-proyectos-http.log 2>&1 &
          echo $! > /tmp/control-proyectos-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/control-proyectos-http.log
          exit 1

      - name: Ejecutar auditoría responsive completa sin ocultar fallos
        shell: bash
        env:
          APP_URL: http://127.0.0.1:4173/
        run: |
          set -o pipefail
          npx playwright test --workers=1 --retries=0 2>&1 | tee responsive-audit.log

      - name: Publicar evidencia de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-report
          path: |
            validation.log
            responsive-audit.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7