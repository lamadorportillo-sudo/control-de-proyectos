name: Diagnóstico temporal de plantillas contractuales

on:
  push:
    branches: [audit-architecture-fixes]
    paths:
      - 'scripts/inspect-contract-template.cjs'
      - '.github/workflows/template-contract-diagnostic.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Extraer texto de las plantillas
        run: node scripts/inspect-contract-template.cjs
      - name: Guardar diagnóstico en la rama aislada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add template-contract-diagnostic.txt
          git commit -m "Diagnóstico textual temporal de plantillas"
          git push origin HEAD:audit-architecture-fixes
