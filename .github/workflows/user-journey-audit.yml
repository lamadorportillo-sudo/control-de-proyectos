name: Recorrido real de usuario

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.cjs'
      - 'tests/full-user-journey-responsive.spec.cjs'
      - '.github/workflows/user-journey-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validar y reconstruir exactamente la página publicada
        shell: bash
        run: |
          set -euo pipefail
          node --check ui-navigation-single-source-v1.js
          node --check tests/full-user-journey-responsive.spec.cjs
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          grep -q 'ui-navigation-single-source-v1.js?v=20260903-singlenav1' index.html
          grep -q '</html>' index.html

      - name: Instalar Playwright
        shell: bash
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Levantar aplicación local
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cc-user-journey-http.log 2>&1 &
          echo $! > /tmp/cc-user-journey-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cc-user-journey-http.log
          exit 1

      - name: Ejecutar ingreso desde cero y recorrido completo
        env:
          APP_URL: http://127.0.0.1:4173/
        run: npx playwright test tests/full-user-journey-responsive.spec.cjs

      - name: Guardar evidencia si hay fallo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-journey-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
