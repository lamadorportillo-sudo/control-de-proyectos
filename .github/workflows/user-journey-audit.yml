name: Recorrido real de usuario

on:
  push:
    branches: [main, audit-architecture-fixes]
    paths:
      - 'index.html'
      - '*.js'
      - '*.cjs'
      - 'tests/full-user-journey-responsive.spec.cjs'
      - 'tests/project-create-route-responsive.spec.cjs'
      - '.github/workflows/user-journey-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.cjs'
      - 'tests/full-user-journey-responsive.spec.cjs'
      - 'tests/project-create-route-responsive.spec.cjs'
      - '.github/workflows/user-journey-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validar y reconstruir exactamente la página publicada
        shell: bash
        run: |
          set -euo pipefail
          node --check authenticated-module-manifest-v1.cjs
          node --check ui-navigation-single-source-v1.js
          node --check ui-stability-v1.js
          node --check performance-runtime-v1.js
          node --check private-access-v1.js
          node --check core-hardening-v1.js
          node --check stabilize-core-v1.cjs
          node --check tests/full-user-journey-responsive.spec.cjs
          node --check tests/project-create-route-responsive.spec.cjs
          node build-pages.cjs
          node inject-portfolio.cjs
          node patch-session-security.cjs
          node stabilize-core-v1.cjs
          grep -q 'ui-navigation-single-source-v1.js?v=20260903-singlenav2' index.html
          grep -q 'private-access-v1.js?v=20260904-private6' index.html
          grep -q 'performance-runtime-v1.js?v=20260904-perf10' index.html
          grep -q 'zordon-continuous-runtime-v1.js?v=20260824-zordon4' index.html
          grep -q 'zordon-chat-ui-v1.js?v=20260824-cleanchat4' index.html
          grep -q '__CC_AUTH_BOOT_FAILED__' index.html
          grep -q "view.screen='project';view.tab='summary'" index.html
          grep -q "const targetPct=Number(contract.recoveryTarget||0);" index.html
          for retired in system-ui-refinement-v2.js dashboard-executive-v1.js home-executive-fix-v2.js industrial-home-v1.js portfolio-redesign-v1.js project-portfolio-detail-v1.js portfolio-screen-fix-v1.js; do
            if grep -q "$retired" index.html; then
              echo "Sigue cargada navegación/dashboard heredado: $retired" >&2
              exit 1
            fi
          done
          grep -q '</html>' index.html

      - name: Instalar Playwright
        shell: bash
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Levantar aplicación local
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cc-user-journey-http.log 2>&1 &
          echo $! > /tmp/cc-user-journey-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cc-user-journey-http.log
          exit 1

      - name: Ejecutar ingreso desde cero y recorrido completo
        env:
          APP_URL: http://127.0.0.1:4173/
        run: npx playwright test tests/full-user-journey-responsive.spec.cjs tests/project-create-route-responsive.spec.cjs --workers=1 --retries=0

      - name: Guardar evidencia si hay fallo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-journey-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
