<script>
'use strict';
const STORE='control_contractual_independiente_v3';
const SESSION='control_contractual_session_v3';
const SUPABASE_URL='https://flethujkrharehjikwgj.supabase.co';
const SUPABASE_KEY='sb_publishable_UqstbAXxbwLd8NqeiyEQrA_IOESNT-6';
let cloudLoaded=false,cloudWorkspaceId=null,cloudRole='consulta',cloudProfile=null,cloudSaveTimer=null,cloudSaving=false,cloudLastSaved=null;
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
const iso=()=>new Date().toISOString(); const today=()=>iso().slice(0,10);
function cents(v){const n=Number(String(v??0).replace(/,/g,''));return Number.isFinite(n)?Math.round((n+Number.EPSILON)*100):0}
function fromCents(c){return Math.round(c)/100}
function round2(v){return fromCents(cents(v))}
function calcPctCents(baseC,pct){return Math.round(baseC*Number(pct||0)/100)}
function fmt(v){return 'L. '+new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(round2(v))}
function fmtC(c){return fmt(fromCents(c))}
function pct(v){return `${round2(v).toFixed(2)}%`}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dmy(s){if(!s)return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function daysBetween(a,b){if(!a||!b)return 0;return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)+1}
function daysTo(date){if(!date)return 99999;return Math.ceil((new Date(date+'T23:59:59')-new Date())/86400000)}
function guaranteeAlert(date){const d=daysTo(date); if(d<0)return{level:'expired',label:'VENCIDA',days:d};if(d<=7)return{level:'urgent',label:'URGENTE',days:d};if(d<=15)return{level:'critical',label:'CRÍTICA',days:d};if(d<=30)return{level:'attention',label:'ATENCIÓN',days:d};if(d<=60)return{level:'warning',label:'PRÓXIMA A VENCER',days:d};return{level:'good',label:'VIGENTE',days:d}}
function statusClass(s){s=(s||'').toLowerCase();if(/pagad|vigente|finaliz|cerrad|aprob/.test(s))return'good';if(/venc|elimin|rechaz/.test(s))return'danger';if(/suspend|crít|urgent/.test(s))return'orange';if(/borrador|pendiente|solicit/.test(s))return'warn';return'blue'}
function procurementMode(type,amount){const a=round2(amount);if(type==='Consultoria'){if(a<=500000)return'1 propuesta';if(a<=1000000)return'2 propuestas';if(a<=2000000)return'3 propuestas';if(a<=3500000)return'Concurso privado';return'Concurso público'}if(type==='BienesServicios'){if(a<=100000)return'1 cotización';if(a<=250000)return'2 cotizaciones';if(a<=450000)return'3 cotizaciones';if(a<=1500000)return'Licitación privada';return'Licitación pública'}if(a<=500000)return'1 cotización';if(a<=2000000)return'2 cotizaciones';if(a<=4000000)return'3 cotizaciones';if(a<=6000000)return'Licitación privada';return'Licitación pública'}
function changeClass(original,deltaAccum){const o=Math.abs(Number(original||0));const p=o?round2(Math.abs(Number(deltaAccum||0))/o*100):0;let suggested=p<=10?'Orden de Cambio':'Adenda';let alert=p>25?'REVISIÓN LEGAL CRÍTICA: supera 25.00%':p>=23?'ALERTA: próximo a 25.00%':p>20?'ATENCIÓN: supera 20.00%':p>10?'Requiere Adenda':'Dentro del rango de Orden de Cambio';return{pct:p,suggested,alert}}
function advanceDeduction(contract,estimates,currentGross,editingId=null){if(!contract||contract.advanceStatus!=='Pagado')return 0;const adv=cents(contract.advancePaid);if(adv<=0)return 0;const base=cents(contract.originalAmount);const targetPct=Number(contract.recoveryTarget||80);const limit=Math.round(base*targetPct/100);if(limit<=0)return 0;const others=estimates.filter(e=>e.id!==editingId).sort((a,b)=>a.number-b.number);let priorGross=0, priorAmort=0;for(const e of others){if(e.number < (editingId?((estimates.find(x=>x.id===editingId)||{}).number||999999):999999)){priorGross+=cents(e.gross);priorAmort+=cents(e.advanceApplied)}}const cumulative=priorGross+cents(currentGross);const target=Math.min(adv,Math.round(adv*cumulative/limit));return fromCents(Math.max(0,Math.min(adv-priorAmort,target-priorAmort)))}
function numberWords(n){
 n=Math.floor(Math.abs(Number(n)||0));
 if(n===0)return'CERO';
 const units=['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIUNO','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
 const tens=['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
 const hundreds=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
 const apocope=x=>String(x||'').replace(/VEINTIUNO$/,'VEINTIÚN').replace(/ Y UNO$/,' Y UN').replace(/ UNO$/,' UN');
 function under1000(x){
  x=Math.floor(Math.abs(x));
  if(x===0)return'';
  if(x===100)return'CIEN';
  const h=Math.floor(x/100),r=x%100;let out=h?(hundreds[h]||''):'';
  if(r){if(out)out+=' ';if(r<30)out+=(units[r]||'');else{const t=Math.floor(r/10),u=r%10;out+=(tens[t]||'');if(u)out+=' Y '+(units[u]||'')}}
  return out.trim();
 }
 function rec(x){
  x=Math.floor(Math.abs(x));
  if(x<1000)return under1000(x);
  if(x<1000000){const th=Math.floor(x/1000),r=x%1000;const a=th===1?'MIL':apocope(rec(th))+' MIL';return a+(r?' '+under1000(r):'')}
  if(x<1000000000){const m=Math.floor(x/1000000),r=x%1000000;const a=m===1?'UN MILLÓN':apocope(rec(m))+' MILLONES';return a+(r?' '+rec(r):'')}
  if(x<1000000000000){const b=Math.floor(x/1000000000),r=x%1000000000;const a=b===1?'MIL MILLONES':apocope(rec(b))+' MIL MILLONES';return a+(r?' '+rec(r):'')}
  return String(x);
 }
 return rec(n).replace(/\s+/g,' ').trim();
}
function amountWords(v){const c=Math.abs(cents(v));const whole=Math.floor(c/100),dec=c%100;let w=numberWords(whole).replace(/VEINTIUNO$/,'VEINTIÚN').replace(/ Y UNO$/,' Y UN').replace(/ UNO$/,' UN');const unit=whole===1?'LEMPIRA':'LEMPIRAS';if(whole>=1000000&&whole%1000000===0) return `${w} DE ${unit} CON ${String(dec).padStart(2,'0')}/100 (${fmt(v)})`;return `${w} ${unit} CON ${String(dec).padStart(2,'0')}/100 (${fmt(v)})`}
function moneyHTML(v){return `<div class="money-dual"><strong>${fmt(v)}</strong><small>${esc(amountWords(v))}</small></div>`}
function moneyCHTML(c){return moneyHTML(fromCents(c))}
function projectContext(p,c=null){return `<div class="project-context"><div class="ctx"><small>Código</small><strong>${esc(p.code)}</strong></div><div class="ctx"><small>Proyecto</small><strong>${esc(p.name)}</strong><div class="linked-note">Vinculado automáticamente</div></div><div class="ctx"><small>Contrato</small><strong>${esc(c?.number||'Pendiente de registrar')}</strong></div><div class="ctx"><small>Ubicación</small><strong>${esc(p.location||'—')}</strong></div></div>`}

/* ===== Compatibilidad de módulos: adjudicación y evaluación final ===== */
function projectProcurement(p){
  if(!p)return {offers:[]};
  const base={
    receiptDate:'',receiptTime:'',processType:'',modality:'',offers:[],suggestedOfferId:'',
    corporationPresentationDate:'',decisionDate:'',decisionStatus:'Pendiente',resolutionRef:'',
    finalAwardOfferId:'',finalAwardName:'',finalAwardAmount:0,differenceObservation:'',notes:''
  };
  if(!p.procurement||typeof p.procurement!=='object')p.procurement={...base};
  else p.procurement=Object.assign(base,p.procurement);
  if(!Array.isArray(p.procurement.offers))p.procurement.offers=[];
  return p.procurement;
}
function procurementSuggestion(p){
  const proc=projectProcurement(p),offers=(proc.offers||[]).slice();
  const selected=offers.find(o=>o.id===proc.suggestedOfferId);
  if(selected)return selected;
  const eligible=offers.filter(o=>o.eligible!==false&&!/rechaz|no cumple|inadmis/i.test(String(o.technicalStatus||'')));
  return (eligible.length?eligible:offers).filter(o=>Number(o.correctedAmount??o.amount)>0).sort((a,b)=>Number(a.correctedAmount??a.amount)-Number(b.correctedAmount??b.amount))[0]||null;
}
function projectCloseout(p){
  const questions=[
    '¿El contratista cumplió la calidad y especificaciones técnicas contratadas?',
    '¿Cumplió el plazo contractual y gestionó adecuadamente cualquier atraso autorizado?',
    '¿Dispuso de personal, equipo y recursos suficientes durante la ejecución?',
    '¿Cumplió las medidas de seguridad, orden y prevención de riesgos exigibles?',
    '¿Presentó estimaciones, soportes, garantías y documentación administrativa de forma completa y oportuna?',
    '¿Atendió y corrigió oportunamente las observaciones emitidas durante las visitas y supervisión?',
    '¿Mantuvo una comunicación y coordinación adecuada con supervisión, entidad y comunidad o usuarios cuando aplicaba?',
    '¿Gestionó adecuadamente cambios, imprevistos, reclamos y trabajos correctivos?',
    '¿El proyecto terminado alcanzó el alcance, funcionalidad y resultados esperados para la inversión realizada?',
    'Considerando el desempeño global, ¿recomendaría contratar nuevamente a este contratista para un proyecto similar?'
  ];
  if(!p)return {questions:questions.map((question,i)=>({id:'q'+(i+1),question,score:0,note:''})),completedAt:'',projectResult:'',lessonsLearned:'',generalObservation:''};
  const old=p.closeoutEvaluation&&typeof p.closeoutEvaluation==='object'?p.closeoutEvaluation:{};
  const prev=Array.isArray(old.questions)?old.questions:[];
  const out=Object.assign({completedAt:'',projectResult:'',lessonsLearned:'',generalObservation:''},old);
  out.questions=questions.map((question,i)=>Object.assign({id:'q'+(i+1),question,score:0,note:''},prev[i]||{}, {question:(prev[i]?.question||question)}));
  p.closeoutEvaluation=out;
  return out;
}

function renderProcurement(p,c){
  const proc=projectProcurement(p),offers=(proc.offers||[]),suggested=procurementSuggestion(p),awarded=offers.find(o=>o.id===proc.finalAwardOfferId)||null;
  const rel=(amount)=>{const b=Number(p.budget||0),a=Number(amount||0);return b?round2((a-b)/b*100):0};
  const rows=offers.length?offers.map((o,i)=>{const corr=Number(o.correctedAmount??o.amount??0),r=rel(corr);return `<tr><td>${i+1}</td><td><b>${esc(o.bidder||'—')}</b></td><td>${moneyHTML(o.amount||0)}</td><td>${moneyHTML(corr)}</td><td>${r>=0?'+':''}${r.toFixed(2)}%</td><td>${esc(o.technicalStatus||'Pendiente')}</td><td>${o.eligible===false?'No':'Sí'}</td><td>${esc(o.notes||'—')}</td><td>${roleCanEdit()?`<button class="btn" data-edit-offer="${o.id}">Editar</button> <button class="btn danger" data-del-offer="${o.id}">Eliminar</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="9" class="empty">No hay ofertas registradas.</td></tr>';
  $('#tabBody').innerHTML=`${projectContext(p,c)}<div class="panel-head"><div><h2>Ofertas y adjudicación</h2><p class="muted">Recepción, análisis económico, sugerencia referencial y decisión final de Corporación.</p></div>${roleCanEdit()?'<div class="actions"><button class="btn" id="editProcurement">Datos del proceso</button><button class="btn primary" id="addOffer">+ Agregar oferta</button></div>':''}</div><div class="offer-summary"><div><small>Recepción de ofertas</small><strong>${dmy(proc.receiptDate)}${proc.receiptTime?' · '+esc(proc.receiptTime):''}</strong></div><div><small>Presupuesto base</small>${moneyHTML(p.budget||0)}</div><div><small>Sugerencia</small><strong>${esc(suggested?.bidder||'Pendiente')}</strong>${suggested?moneyHTML(suggested.correctedAmount??suggested.amount):''}</div><div><small>Adjudicación final</small><strong>${esc(awarded?.bidder||proc.finalAwardName||'Pendiente')}</strong>${awarded?moneyHTML(awarded.correctedAmount??awarded.amount):proc.finalAwardAmount?moneyHTML(proc.finalAwardAmount):''}</div></div><div class="table-wrap"><table class="table" style="min-width:1100px"><thead><tr><th>N.º</th><th>Oferente</th><th>Ofertado</th><th>Corregido</th><th>Vs. presupuesto</th><th>Evaluación técnica</th><th>Elegible</th><th>Observaciones</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="summary-grid" style="margin-top:14px"><div class="info"><small>Presentación a Corporación</small><strong>${dmy(proc.corporationPresentationDate)}</strong></div><div class="info"><small>Fecha de decisión</small><strong>${dmy(proc.decisionDate)}</strong></div><div class="info"><small>Estado de decisión</small><strong>${esc(proc.decisionStatus||'Pendiente')}</strong></div><div class="info"><small>Acta / resolución</small><strong>${esc(proc.resolutionRef||'—')}</strong></div>${proc.differenceObservation?`<div class="info wide"><small>Justificación cuando difiere de la sugerencia</small><strong>${esc(proc.differenceObservation)}</strong></div>`:''}</div>`;
  if(roleCanEdit()){
    $('#editProcurement').onclick=()=>{

      const p=arr(db.projects).find(x=>x.id===view.projectId);if(p){const a=progressForProject(p),cells=[...body.querySelectorAll('.info')],auto=cells.find(x=>/Avance automático/i.test(x.querySelector('small')?.textContent||''));if(auto){auto.innerHTML=`<small>Avance físico observado</small><strong>${a.physicalAvailable?a.physical.toFixed(2)+'%':'Sin registrar'}</strong><small>${a.source}</small>`;auto.insertAdjacentHTML('afterend',`<div class="info"><small>Avance certificado</small><strong>${a.financial.toFixed(2)}%</strong><small>Solo estimaciones aprobadas o pagadas</small></div><div class="info"><small>Avance financiero propuesto</small><strong>${a.proposed.toFixed(2)}%</strong><small>Incluye estimaciones aún no certificadas</small></div><div class="info"><small>Avance pagado</small><strong>${a.paid.toFixed(2)}%</strong><small>Desembolsos registrados</small></div>`);body.dataset.ccProgressDecorated='1'}}
    }
    document.querySelectorAll('.field span').forEach(sp=>{if(sp.textContent.trim()==='Modalidad sugerida')sp.textContent='Modalidad de referencia'});
  }catch(e){console.warn('Decoración de integridad',e)}
}
new MutationObserver(()=>setTimeout(decorate,0)).observe(document.documentElement,{subtree:true,childList:true});
setTimeout(()=>{decorate();try{hardenedSyncProgress()}catch{}},0);
window.ccProgressForProject=progressForProject;
window.ccSaveCloudNow=hardenedSaveCloudNow;
})();

render();
</script>

    const byId=offers.find(o=>o.id===proc.suggestedOfferId);if(byId)return byId;
    const eligible=offers.filter(o=>o.eligible!==false&&!/rechaz|no cumple|inadmis/i.test(String(o.technicalStatus||'')));
    return (eligible.length?eligible:offers).slice().filter(o=>Number(o.correctedAmount??o.amount)>0).sort((a,b)=>Number(a.correctedAmount??a.amount)-Number(b.correctedAmount??b.amount))[0]||null;
  }
  function relationText(diff){return diff>0?'superior':diff<0?'inferior':'igual';}
  function buildMunicipalAwardReport(p,c){
    const proc=p.procurement||{},offers=(proc.offers||[]).slice(),base=Number(p.budget||0),ctrl=typeof contractControlDefaults==='function'?contractControlDefaults(c?.controls||{}):(c?.controls||{}),suggested=awardSuggestion(offers,proc),awarded=offers.find(o=>o.id===proc.finalAwardOfferId)||null;
    const reportDate=proc.corporationPresentationDate||proc.decisionDate||today(),funding=ctrl.financingSource||'Fondos Municipales',modality=(proc.processType||proc.modality||(typeof procurementMode==='function'?procurementMode(p.type,p.budget):'Cotización')||'Cotización').toString(),location=p.location||'Santa María, La Paz';
    const sugAmount=Number(suggested?.correctedAmount ?? suggested?.amount ?? 0),sugDiff=sugAmount-base,sugPct=base?Math.abs(sugDiff/base*100):0,sugRel=relationText(sugDiff),finalName=awarded?.bidder||proc.finalAwardName||'',finalAmount=Number(awarded?.correctedAmount ?? awarded?.amount ?? proc.finalAwardAmount ?? 0),awardDifferent=!!(finalName&&suggested&&finalName.trim().toLowerCase()!==String(suggested.bidder||'').trim().toLowerCase());

    const note=suggested?`La oferta más conveniente es <b>${esc(suggested.bidder)}</b> con un <b>${sugPct.toFixed(2)}%</b> ${sugRel} al presupuesto base.`:'No existe una sugerencia automática porque no hay ofertas elegibles registradas.';
    const recommendation=suggested?`Adjudicar a <strong>${esc(suggested.bidder)}</strong>, que ocupa el primer lugar según el análisis de las ofertas registradas, para la realización del proyecto <strong>${esc(p.name)}</strong>, por el monto evaluado de <strong>${fmt(sugAmount)}</strong>, que equivale a <strong>${sugPct.toFixed(2)}% ${sugRel}</strong> en relación con el presupuesto base de <strong>${fmt(base)}</strong>. Por lo que la comisión considera esta oferta la más conveniente para los intereses de la municipalidad.`:`Completar la evaluación y elegibilidad de las ofertas antes de emitir una recomendación de adjudicación.`;

    return `<div class="report-paper municipal-award-report"><div class="ma-header"><img class="ma-crest" alt="Municipalidad de Santa María, La Paz" src="${MUNICIPAL_CREST}"><div class="ma-muni">Municipalidad de Santa María, La Paz</div><div class="ma-contact">Email: <a>munisantamaria@yahoo.com</a><br><a>lapazsantamaria@municipalidad.info</a><br>Tel. 9824-0104</div></div><div class="ma-date">Santa María La Paz, ${awardLongDate(reportDate)}</div><div class="ma-addressee">CORPORACIÓN MUNICIPAL<br>MUNICIPALIDAD DE SANTA MARÍA</div><p class="ma-lead">La comisión evaluadora informa:</p><p class="ma-body"><b>1. La comisión evaluadora presenta el Informe de Adjudicación de Proyecto:</b><br>Se realizó <strong>${esc(modality.toUpperCase())}</strong> para el proyecto <strong>${esc(p.name.toUpperCase())}</strong>, código <strong>${esc(p.code)}</strong>, financiado con <strong>${esc(funding)}</strong>. El acto de recepción y apertura se realizó el día <strong>${awardLongDate(proc.receiptDate)}</strong>${proc.receiptTime?` a las <strong>${awardTime(proc.receiptTime)}</strong>`:''}, presentándose las siguientes ofertas:</p><div class="ma-table-wrap"><table class="ma-table"><thead><tr><th colspan="8" class="project-head">${esc(p.name.toUpperCase())}</th></tr><tr><th colspan="8" class="project-head">${esc(location)}</th></tr><tr><th colspan="8">ANÁLISIS DE LAS OFERTAS ECONÓMICAS · MONTOS EN LEMPIRAS</th></tr><tr><th style="width:4%">N.º</th><th style="width:20%">PARTICIPANTES</th><th style="width:12%">OFERTADO</th><th style="width:12%">CORREGIDO</th><th style="width:13%">ERROR EN LEMPIRAS DE OFERTADO MENOS CORREGIDO</th><th style="width:9%">ERROR EN PORCENTAJE</th><th style="width:15%">DIFERENCIA CORREGIDO CON EL PRESUPUESTO BASE EN LPS.</th><th style="width:15%">RELACIÓN DE LA OFERTA CON EL PRESUPUESTO BASE (%)</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="ma-center">No hay ofertas registradas.</td></tr>'}<tr class="budget-row"><th colspan="6">PRESUPUESTO BASE</th><td colspan="2">${base?fmt(base):'NO REGISTRADO'}</td></tr><tr class="note-row"><td colspan="8"><b>NOTA:</b> ${note}</td></tr></tbody></table></div><div class="ma-recommend-title">RECOMENDACIONES:</div><p class="ma-recommend">${recommendation}</p>${suggested?`<div class="ma-words"><b>Monto recomendado en letras:</b> ${esc(amountWords(sugAmount))}<br><b>Presupuesto base en letras:</b> ${esc(amountWords(base))}</div>`:''}${decision}<div class="ma-sign"><strong>${esc((currentUser()?.name||'RESPONSABLE DE PROYECTOS').toUpperCase())}</strong><span>UNIDAD DE PROYECTOS</span></div><div class="ma-footnote"><span>Expediente: ${esc(p.code)}</span><span>Generado desde Control de Proyectos · Verificar antes de firma y remisión oficial.</span></div></div>`;
  }
  buildProjectReport=function(p,c,type='integral'){if(type==='adjudicacion')return buildMunicipalAwardReport(p,c);return originalBuildProjectReport(p,c,type);};

    `;document.head.appendChild(s);

  const VIEW_KEY='cp_dashboard_view_v3';

  const clamp=v=>Math.max(0,Math.min(100,Number(v)||0));
  function timeProgress(p,c){

  function projectHealth(p,c,progress,timePct,gAlerts){

  projectCardHTML=function(p){

  };

  function reviewActionLabel(tab){return tab==='guarantees'?'Revisar garantías':tab==='estimates'?'Revisar pagos / estimaciones':tab==='visits'?'Revisar visitas y observaciones':tab==='procurement'?'Revisar adjudicación':'Abrir resumen del proyecto'}
  function openReviewIssues(follow){
    if(!follow?.items?.length)return toast('No hay asuntos pendientes con la información registrada.');
    const pr={expired:'Vencido',urgent:'Urgente',critical:'Crítico',attention:'Atención',warning:'Seguimiento',info:'Informativo'};
    const m=openModal('Asuntos por revisar',`<p class="muted">Estos asuntos se detectan automáticamente con los datos del expediente. Selecciona uno para ir directamente al lugar donde debes revisarlo.</p><div class="review-modal-list">${follow.items.map(x=>{const p=db.projects.find(z=>z.id===x.projectId);return `<button type="button" class="review-modal-item" data-review-project="${x.projectId}" data-review-tab="${x.tab}"><span class="review-modal-icon">${x.icon}</span><span><strong>${esc(p?.name||p?.code||'Proyecto')}</strong><b>${esc(x.title)}</b><small>${esc(x.detail)} · ${reviewActionLabel(x.tab)}</small></span><span class="review-priority ${x.level}">${pr[x.level]||'Revisar'}</span></button>`}).join('')}</div>`);
    $$('[data-review-project]',m).forEach(b=>b.onclick=()=>{view.projectId=b.dataset.reviewProject;view.screen='project';view.tab=b.dataset.reviewTab||'summary';m.remove();renderApp()});
  }

  renderProjects=function(k={total:0,estimated:0,paid:0,alerts:0}){
    const active=db.projects.filter(p=>!p.deletedAt),totalC=Math.max(0,k.total||0),estimatedPct=totalC?clamp(round2(k.estimated/totalC*100)):0,paidPct=totalC?clamp(round2(k.paid/totalC*100)):0,inExecution=active.filter(p=>/ejecuci/i.test(p.status||'')).length,inProcurement=active.filter(p=>/contrat|adjudic/i.test(p.status||'')).length,completed=active.filter(p=>/finaliz|cerrad/i.test(p.status||'')).length,others=Math.max(0,active.length-inExecution-inProcurement-completed),follow=dashboardFollowups(active),visibleFollow=follow.items;
    const statusMatch=p=>dashStatus==='all'||(dashStatus==='execution'?/ejecuci/i.test(p.status||''):dashStatus==='procurement'?/contrat|adjudic/i.test(p.status||''):dashStatus==='closed'?/finaliz|cerrad/i.test(p.status||''):true);
    const rows=db.projects.filter(p=>view.trash?!!p.deletedAt:!p.deletedAt).filter(statusMatch).filter(p=>!view.search||[p.code,p.name,p.location,p.status].join(' ').toLowerCase().includes(view.search.toLowerCase()));
    const maxState=Math.max(1,inExecution,inProcurement,completed,others),projectWord=active.length===1?'expediente':'expedientes';
    $('#content').innerHTML=`${view.trash?'':`<section class="exec-overview"><div class="exec-intro"><div class="exec-title-row"><div><p class="eyebrow">CENTRO DE CONTROL EJECUTIVO</p><h2>Portafolio de proyectos bajo control.</h2><p>Visualiza avance, dinero, plazos y compromisos en una sola pantalla. Las alertas priorizan lo que necesita atención sin revisar expediente por expediente.</p></div><span class="exec-sync"><i></i>SUPABASE CONECTADO</span></div><div class="exec-chips"><span class="exec-chip"><i class="good"></i><b>${inExecution}</b> en ejecución</span><span class="exec-chip"><i class="warn"></i><b>${inProcurement}</b> contratación / adjudicación</span><span class="exec-chip"><i></i><b>${completed}</b> finalizados</span><button type="button" class="exec-chip review-issues-chip" id="reviewIssuesBtn"><i class="${follow.items.length?'danger':'good'}"></i><b>${follow.items.length}</b><span>asuntos por revisar</span>${follow.items.length?'<em>Ver detalle</em>':''}</button></div></div><div class="exec-visual"><div class="portfolio-ring" style="--p:${estimatedPct}"><div class="portfolio-ring-content"><b>${estimatedPct.toFixed(2)}%</b><small>avance global</small></div></div><div class="exec-finance"><div class="exec-money"><small>Portafolio contractual</small><strong>${fmtC(totalC)}</strong><span>${active.length} ${projectWord} activos</span></div><div><div class="exec-bar-label"><span>Estimado acumulado</span><b>${fmtC(k.estimated||0)}</b></div><div class="exec-bar"><i style="width:${estimatedPct}%"></i></div></div><div><div class="exec-bar-label"><span>Pagado / desembolsado</span><b>${paidPct.toFixed(2)}%</b></div><div class="exec-bar"><i class="green" style="width:${paidPct}%"></i></div></div></div></div></section>`}
    <section class="exec-kpis"><article class="exec-kpi"><div class="exec-kpi-top"><small>Proyectos activos</small><span class="exec-kpi-icon">▦</span></div><strong>${active.length}</strong><div class="exec-kpi-foot"><b>${inExecution}</b> ejecución · <b>${inProcurement}</b> contratación</div></article><article class="exec-kpi"><div class="exec-kpi-top"><small>Monto contractual</small><span class="exec-kpi-icon">L</span></div>${moneyCHTML(totalC)}<div class="exec-kpi-foot">Total registrado en el portafolio</div></article><article class="exec-kpi"><div class="exec-kpi-top"><small>Total estimado</small><span class="exec-kpi-icon">↗</span></div>${moneyCHTML(k.estimated||0)}<div class="exec-kpi-foot"><b>${estimatedPct.toFixed(2)}%</b> del monto contractual</div></article><article class="exec-kpi"><div class="exec-kpi-top"><small>Total pagado</small><span class="exec-kpi-icon">✓</span></div>${moneyCHTML(k.paid||0)}<div class="exec-kpi-foot"><b>${paidPct.toFixed(2)}%</b> desembolsado</div></article></section>
    <section class="dashboard-workspace-v3"><section class="projects-board"><div class="board-head"><div><p class="eyebrow">EXPEDIENTES</p><h2>${view.trash?'Papelera de proyectos':'Proyectos registrados'}</h2><p>${view.trash?'Restaura o elimina definitivamente los expedientes.':'Compara avance, plazo, monto y estado antes de abrir cada expediente.'}</p></div><div class="board-controls"><div class="view-switch"><button data-dashboard-view="cards" class="${dashView==='cards'?'active':''}">☰ Lista</button><button data-dashboard-view="compact" class="${dashView==='compact'?'active':''}">☰ Lista</button></div><button class="btn" id="trashToggle">${view.trash?'← Volver':'Papelera'}</button></div></div><div class="filter-row"><input class="search" id="projectSearch" placeholder="Buscar por código, proyecto, ubicación o estado…" value="${esc(view.search||'')}"><div class="status-filters"><button class="status-filter ${dashStatus==='all'?'active':''}" data-status-filter="all">Todos ${active.length}</button><button class="status-filter ${dashStatus==='execution'?'active':''}" data-status-filter="execution">Ejecución ${inExecution}</button><button class="status-filter ${dashStatus==='procurement'?'active':''}" data-status-filter="procurement">Adjudicación ${inProcurement}</button><button class="status-filter ${dashStatus==='closed'?'active':''}" data-status-filter="closed">Finalizados ${completed}</button></div></div><div class="project-grid-v3 ${dashView==='compact'?'compact':''}">${rows.length?rows.map(projectCardHTML).join(''):'<div class="empty">No hay proyectos que coincidan con esta vista.</div>'}</div></section>${view.trash?'':`<aside class="control-rail-v3"><div class="rail-card"><div class="rail-title"><div><p class="eyebrow">SEGUIMIENTO</p><h3>Asuntos por revisar</h3><p>Haz clic en cada asunto para ir directamente al expediente y sección correspondiente.</p></div><div class="rail-attention-count">${follow.items.length}</div></div><div class="rail-alert-list">${visibleFollow.length?visibleFollow.map(x=>`<button class="rail-alert" data-follow-project="${x.projectId}" data-follow-tab="${x.tab}"><span class="rail-alert-icon">${x.icon}</span><span><b>${esc(x.title)}</b><small>${esc(x.detail)}</small></span><span>›</span></button>`).join(''):'<div class="rail-empty">✓ No se detectan asuntos críticos actualmente.</div>'}</div></div><div class="rail-card"><p class="eyebrow">ESTADO DEL PORTAFOLIO</p><h3>Distribución actual</h3><div class="rail-state"><div class="rail-state-row"><span>En ejecución</span><b>${inExecution}</b><div class="rail-state-bar"><i class="green" style="width:${inExecution/maxState*100}%"></i></div></div><div class="rail-state-row"><span>Contratación / adjudicación</span><b>${inProcurement}</b><div class="rail-state-bar"><i class="amber" style="width:${inProcurement/maxState*100}%"></i></div></div><div class="rail-state-row"><span>Finalizados</span><b>${completed}</b><div class="rail-state-bar"><i style="width:${completed/maxState*100}%"></i></div></div>${others?`<div class="rail-state-row"><span>Otros estados</span><b>${others}</b><div class="rail-state-bar"><i style="width:${others/maxState*100}%"></i></div></div>`:''}</div></div><div class="rail-card"><p class="eyebrow">ACCESOS RÁPIDOS</p><h3>Registrar actividad</h3><div class="rail-quick"><button class="primary" data-quick-action="project">＋ Nuevo proyecto<span>Crear expediente</span></button><button data-quick-action="estimate">E · Estimación<span>Registrar pago</span></button><button data-quick-action="visit">V · Visita<span>Supervisión</span></button><button data-quick-action="guarantee">G · Garantía<span>Vigencia y monto</span></button><button data-quick-action="report">↗ Informe<span>Generar documento</span></button></div></div><div class="rail-card"><p class="eyebrow">CONTROL</p><h3>Indicadores pendientes</h3><div class="rail-state"><div class="rail-state-row"><span>Garantías con alerta</span><b>${k.alerts||0}</b></div><div class="rail-state-row"><span>Observaciones pendientes</span><b>${follow.stats.pendingObs||0}</b></div><div class="rail-state-row"><span>Anticipos por amortizar</span><b>${follow.stats.pendingAdvance||0}</b></div><div class="rail-state-row"><span>Estimaciones pendientes</span><b>${follow.stats.pendingEstimates||0}</b></div></div></div></aside>`}</section>`;

    const rerender=()=>renderProjects(k);

    $('#projectSearch').oninput=e=>{view.search=e.target.value;const q=view.search.trim().toLowerCase(),grid=document.querySelector('.project-grid-v3');if(!grid)return;const cards=[...grid.querySelectorAll('.project-v3')];let visible=0;cards.forEach(card=>{const show=!q||card.textContent.toLowerCase().includes(q);card.hidden=!show;if(show)visible++});let empty=grid.querySelector('[data-search-empty]');if(!visible){if(!empty){empty=document.createElement('div');empty.className='empty';empty.dataset.searchEmpty='1';empty.textContent='No hay proyectos que coincidan con la búsqueda.';grid.appendChild(empty)}}else if(empty)empty.remove()};
    $$('[data-dashboard-view]').forEach(b=>b.onclick=()=>{dashView=b.dataset.dashboardView;localStorage.setItem(VIEW_KEY,dashView);rerender()});
    $$('[data-status-filter]').forEach(b=>b.onclick=()=>{dashStatus=b.dataset.statusFilter;rerender()});
    $$('[data-open]').forEach(b=>b.onclick=()=>{view.projectId=b.dataset.open;view.screen='project';view.tab='summary';renderApp()});
    const reviewBtn=$('#reviewIssuesBtn');if(reviewBtn)reviewBtn.onclick=()=>openReviewIssues(follow);
    $$('[data-follow-project]').forEach(b=>b.onclick=()=>{view.projectId=b.dataset.followProject;view.screen='project';view.tab=b.dataset.followTab||'summary';renderApp()});
    $$('[data-quick-action]').forEach(b=>b.onclick=()=>dashboardQuickAction(b.dataset.quickAction));
    $$('[data-edit-project]').forEach(b=>b.onclick=()=>projectModal(db.projects.find(p=>p.id===b.dataset.editProject)));
    $$('[data-trash]').forEach(b=>b.onclick=()=>{const p=db.projects.find(x=>x.id===b.dataset.trash);if(p&&confirm(`¿Mover ${p.name} a la Papelera?`)){p.deletedAt=iso();audit('ELIMINAR','Proyecto',p.id,{code:p.code,name:p.name});saveDB();renderApp()}});
    $$('[data-restore]').forEach(b=>b.onclick=()=>{const p=db.projects.find(x=>x.id===b.dataset.restore);if(p){p.deletedAt=null;audit('RESTAURAR','Proyecto',p.id,{code:p.code,name:p.name});saveDB();renderApp()}});
    $$('[data-purge]').forEach(b=>b.onclick=()=>{const p=db.projects.find(x=>x.id===b.dataset.purge);if(!p||!confirm(`Eliminar definitivamente ${p.name} y todos sus datos vinculados? Esta acción no se puede deshacer.`))return;const cs=db.contracts.filter(c=>c.projectId===p.id).map(c=>c.id);db.projects=db.projects.filter(x=>x.id!==p.id);db.contracts=db.contracts.filter(c=>c.projectId!==p.id);db.estimates=db.estimates.filter(e=>!cs.includes(e.contractId)&&e.projectId!==p.id);db.guarantees=db.guarantees.filter(g=>g.projectId!==p.id);db.changes=db.changes.filter(ch=>!cs.includes(ch.contractId)&&ch.projectId!==p.id);db.payments=db.payments.filter(x=>x.projectId!==p.id);db.visits=db.visits.filter(x=>x.projectId!==p.id);audit('ELIMINAR DEFINITIVO','Proyecto',p.id,{code:p.code,name:p.name});saveDB();renderApp()});
  };
})();

  `;
  const style=document.createElement('style');style.id='project-summary-v4-styles';style.textContent=css;document.head.appendChild(style);

  function timeData(p,c){
    const start=c?.start||p.start||'';
    const end=c?.end||p.end||'';
    if(!start||!end)return {start,end,total:0,elapsed:0,pct:0,left:null,valid:false};
    const total=Math.max(1,daysBetween(start,end));
    const now=today();
    const startD=new Date(start+'T12:00:00'), endD=new Date(end+'T12:00:00'), nowD=new Date(now+'T12:00:00');
    let elapsed=0;
    if(nowD>=startD) elapsed=Math.min(total,Math.max(0,daysBetween(start,now)));
    const pct=Math.max(0,Math.min(100,round2(elapsed/total*100)));
    const left=Math.ceil((endD-nowD)/86400000);
    return {start,end,total,elapsed,pct,left,valid:true};
  }
  function summaryDiagnosis(p,c,progress,time,gs,pendingObs){
    const activeAlerts=(gs||[]).map(g=>({g,a:guaranteeAlert(g.end)})).filter(x=>x.a.level!=='good');
    const severeG=activeAlerts.some(x=>['expired','urgent','critical'].includes(x.a.level));
    const gap=time.valid?round2(time.pct-progress):0;
    const overdue=time.valid&&time.left<0&&progress<100;
    let level='good',label='DENTRO DE CONTROL',title='El proyecto no presenta desviaciones críticas con los datos registrados.';
    if(overdue||severeG||gap>15){level='danger';label='REQUIERE CORRECCIÓN';title=overdue?'El plazo contractual está vencido y el avance registrado aún no llega al 100%.':severeG?'Existe al menos una garantía en condición crítica, urgente o vencida.':`El tiempo consumido supera el avance en ${gap.toFixed(2)} puntos porcentuales.`}
    else if(gap>7||activeAlerts.length||pendingObs>0){level='warn';label='REQUIERE SEGUIMIENTO';title=gap>7?`El tiempo consumido supera el avance en ${gap.toFixed(2)} puntos porcentuales.`:activeAlerts.length?'Existen garantías que requieren seguimiento por su vigencia.':`Hay ${pendingObs} observación${pendingObs===1?'':'es'} de supervisión pendiente${pendingObs===1?'':'s'}.`}
    else if(!time.valid){level='info';label='CONTROL PARCIAL';title='No hay fechas suficientes para comparar avance contra tiempo contractual.'}
    return {level,label,title,gap,activeAlerts};
  }

ss="field"><span>Contratista</span><input value="${esc(data.contractor||'')}" readonly></label><label class="field wide"><span>Proyecto</span><input value="${esc(data.name||'')}" readonly></label></div><div class="table-wrap" style="margin-top:9px"><table class="scan-est-table"><thead><tr><th>N.º</th><th>Pagado</th><th>Calidad</th><th>Anticipo</th><th>Total</th><th>De</th><th>Al</th></tr></thead><tbody>${data.rows.map(r=>`<tr><td>${r.number}</td><td>${fmt(r.paid)}</td><td>${fmt(r.quality)}</td><td>${fmt(r.advance)}</td><td>${fmt(r.gross)}</td><td>${r.start}</td><td>${r.end}</td></tr>`).join('')||'<tr><td colspan="7">No se leyó una fila con suficiente seguridad; podrás completarla manualmente.</td></tr>'}</tbody></table></div><div class="scan-actions" style="margin-top:10px"><button class="btn primary" id="deepContinue">Revisar y completar →</button></div></div>`;document.getElementById('deepContinue').onclick=()=>openLegacy(data,p,c)}catch(e){console.error(e);tx.textContent='No se pudo completar la lectura profunda.';toast('No se pudo completar el OCR profundo.')}finally{run.disabled=false}};m.querySelector('.cancel').onclick=mRemove}
window.scanEstimateModalDeep=deepModal;window.scanEstimateModal=deepModal;
function bind(){let b=document.getElementById('scanEstimateBtn');if(b){b.textContent='▣ Escaneo profundo';let p=view?.projectId?db.projects.find(x=>x.id===view.projectId):null,c=p?db.contracts.find(x=>x.projectId===p.id):null;b.onclick=()=>deepModal(p,c)}let q=document.querySelector('[data-quick-action="scan"]');if(q){q.innerHTML='▣ Escaneo profundo<span>Leer oficio + tabla</span>';q.onclick=()=>deepModal()}}
let re=window.renderEstimates;if(typeof re==='function')window.renderEstimates=function(p,c,e){re(p,c,e);bind()};let rp=window.renderProjects;if(typeof rp==='function')window.renderProjects=function(k){rp(k);setTimeout(bind,0)};setTimeout(bind,0);
})();

<script>
/* ===== APRENDIZAJE ADAPTATIVO V1 ===== */
(()=>{
if(window.__learnV1)return;window.__learnV1=1;
const R=n=>Math.round((+n||0)*100)/100,D=(a,b)=>{if(!a||!b)return 0;return Math.max(0,Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5))},M=a=>{a=a.map(Number).filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return 0;let m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2},P=n=>R(n).toFixed(2)+'%',E=s=>typeof esc==='function'?esc(String(s??'')):String(s??'');
function store(){if(!db.adaptiveLearning)db.adaptiveLearning={enabled:true,version:1,reportUsage:{},profile:null};return db.adaptiveLearning}
function prof(){let s=store(),ps=(db.projects||[]).filter(x=>!x.deletedAt),cs=db.contracts||[],es=db.estimates||[],vs=db.visits||[],obs=vs.flatMap(v=>v.observations||[]),q=es.map(e=>+e.qualityPct).filter(x=>x>0),is=es.map(e=>+e.isrPct).filter(x=>x>0),period=es.map(e=>D(e.start,e.end)).filter(x=>x>0&&x<366),adv=cs.map(c=>{let b=+c.originalAmount||+c.currentAmount||0,v=+c.advancePaid||+c.advanceApproved||0;return b&&v?100*v/b:0}).filter(x=>x>0),rec=cs.map(c=>+c.recoveryTarget).filter(x=>x>0),g=[];for(let p of ps){let x=vs.filter(v=>v.projectId===p.id&&v.date).sort((a,b)=>a.date.localeCompare(b.date));for(let i=1;i<x.length;i++){let d=D(x[i-1].date,x[i].date);if(d>0&&d<180)g.push(d)}}let dec=ps.map(p=>p.procurement).filter(x=>x&&(x.finalAwardOfferId||x.finalAwardName)),diff=0;for(let pr of dec){let o=(pr.offers||[]).filter(x=>x.eligible!==false).sort((a,b)=>(+a.correctedAmount||+a.amount)-(+b.correctedAmount||+b.amount));if(o[0]&&pr.finalAwardOfferId&&o[0].id!==pr.finalAwardOfferId)diff++}return s.profile={updatedAt:new Date().toISOString(),samples:{projects:ps.length,contracts:cs.length,estimates:es.length,visits:vs.length,observations:obs.length,scans:es.filter(e=>e.importMeta?.source).length},estimate:{quality:M(q),isr:M(is),isrUse:es.length?R(100*es.filter(e=>+e.isrPct>0).length/es.length):0,period:M(period),manual:es.length?R(100*es.filter(e=>e.manual).length/es.length):0},contract:{advance:M(adv),advanceUse:cs.length?R(100*cs.filter(c=>(+c.advancePaid||+c.advanceApproved)>0).length/cs.length):0,recovery:M(rec)||80},visits:{gap:M(g),pending:obs.filter(o=>o.status!=='Atendida').length},proc:{decisions:dec.length,diff:dec.length?R(100*diff/dec.length):0},reports:s.reportUsage},s.profile}
function estSug(p,c){let all=db.estimates||[],same=all.filter(e=>{let cc=(db.contracts||[]).find(x=>x.id===e.contractId),pp=(db.projects||[]).find(x=>x.id===cc?.projectId);return pp?.type===p?.type}),x=same.length?same:all;return{n:x.length,q:M(x.map(e=>+e.qualityPct).filter(v=>v>0))||+c?.controls?.qualityRetentionPct||5,isr:(x.length&&x.filter(e=>+e.isrPct>0).length/x.length>=.5)?M(x.map(e=>+e.isrPct).filter(v=>v>0)):0,days:M(x.map(e=>D(e.start,e.end)).filter(v=>v>0))}}
function actions(){let out=[],pf=prof();for(let p of (db.projects||[]).filter(x=>!x.deletedAt)){let c=(db.contracts||[]).find(x=>x.projectId===p.id),es=c?(db.estimates||[]).filter(e=>e.contractId===c.id):[],vs=(db.visits||[]).filter(v=>v.projectId===p.id);if(/adjudic/i.test(p.status||'')&&!c)out.push([p,'contract','Registrar contrato','El proyecto está adjudicado y no tiene contrato registrado.']);if(/ejecuci/i.test(p.status||'')&&c&&!es.length)out.push([p,'estimates','Registrar primera estimación','El proyecto está en ejecución y aún no tiene estimaciones/pagos.']);if(/ejecuci/i.test(p.status||'')&&pf.visits.gap&&vs.length){let last=vs.filter(v=>v.date).sort((a,b)=>b.date.localeCompare(a.date))[0],d=D(last?.date,new Date().toISOString().slice(0,10));if(d>pf.visits.gap*1.35)out.push([p,'visits','Programar visita',`Tu historial indica seguimiento cada ${Math.round(pf.visits.gap)} días; han pasado ${d}.`])}}return out.slice(0,10)}
function modal(){let s=store(),p=prof(),a=actions(),h=`<div class="alert info"><b>Aprendizaje controlado.</b> Aprende de tus proyectos, correcciones y decisiones; nunca cambia un dato oficial sin que tú lo confirmes.</div><div class="advance"><div><small>Proyectos</small><strong>${p.samples.projects}</strong></div><div><small>Estimaciones</small><strong>${p.samples.estimates}</strong></div><div><small>Visitas</small><strong>${p.samples.visits}</strong></div><div><small>Escaneos</small><strong>${p.samples.scans}</strong></div></div><div class="panel"><h3>Patrones aprendidos</h3><div class="summary-grid"><div class="info"><small>Calidad habitual</small><strong>${p.estimate.quality?P(p.estimate.quality):'Sin suficiente historial'}</strong></div><div class="info"><small>ISR habitual</small><strong>${p.estimate.isr?P(p.estimate.isr):'No frecuente'}</strong><small>Se aplica en ${P(p.estimate.isrUse)}</small></div><div class="info"><small>Período de estimación</small><strong>${p.estimate.period?Math.round(p.estimate.period)+' días':'Sin suficiente historial'}</strong></div><div class="info"><small>Anticipo típico</small><strong>${p.contract.advance?P(p.contract.advance):'Sin suficiente historial'}</strong></div><div class="info"><small>Recuperación anticipo</small><strong>${P(p.contract.recovery)}</strong></div><div class="info"><small>Frecuencia de visitas</small><strong>${p.visits.gap?Math.round(p.visits.gap)+' días':'Sin suficiente historial'}</strong></div><div class="info"><small>Decisiones adjudicación</small><strong>${p.proc.decisions}</strong><small>${P(p.proc.diff)} difieren de oferta elegible más baja</small></div><div class="info"><small>Correcciones manuales</small><strong>${P(p.estimate.manual)}</strong><small>de estimaciones registradas</small></div></div></div><div class="panel"><h3>Siguiente acción sugerida</h3>${a.length?a.map((x,i)=>`<button class="btn" style="display:block;width:100%;text-align:left;margin:6px 0" data-la="${i}"><b>${E(x[2])} · ${E(x[0].code)}</b><small class="muted" style="display:block">${E(x[3])}</small></button>`).join(''):'<div class="alert good">No se detectan pasos adaptativos pendientes con los datos actuales.</div>'}</div><div class="panel"><label class="row spread"><span><b>Aprendizaje adaptativo</b><small class="muted" style="display:block">Puedes desactivarlo sin borrar ningún expediente.</small></span><input id="learnOn" type="checkbox" style="width:auto" ${s.enabled!==false?'checked':''}></label><div class="actions"><button class="btn" id="learnCalc">Recalcular</button><button class="btn danger" id="learnReset">Borrar solo aprendizaje</button></div></div>`;let m=openModal('🧠 Aprendizaje adaptativo',h);m.querySelector('#learnOn').onchange=e=>{s.enabled=e.target.checked;saveDB();toast(s.enabled?'Aprendizaje activado.':'Aprendizaje desactivado.')};m.querySelector('#learnCalc').onclick=()=>{prof();saveDB();m.remove();modal()};m.querySelector('#learnReset').onclick=()=>{if(confirm('¿Borrar la memoria adaptativa? Los expedientes no se eliminarán.')){db.adaptiveLearning={enabled:true,version:1,reportUsage:{},profile:null};saveDB();m.remove();modal()}};m.querySelectorAll('[data-la]').forEach(b=>b.onclick=()=>{let x=a[+b.dataset.la];view.projectId=x[0].id;view.screen='project';view.tab=x[1];m.remove();renderApp()})}
function button(){let t=document.querySelector('.top-actions');if(!t||document.getElementById('learnBtn'))return;let b=document.createElement('button');b.id='learnBtn';b.className='btn';b.textContent='🧠 Aprendizaje';b.onclick=modal;let u=t.querySelector('.userbox');u?t.insertBefore(b,u):t.appendChild(b)}
function estForm(){let f=document.getElementById('estForm');if(!f||f.dataset.learn)return;f.dataset.learn=1;if(store().enabled===false)return;let p=(db.projects||[]).find(x=>x.id===view.projectId),c=(db.contracts||[]).find(x=>x.projectId===p?.id);if(!p||!c)return;let s=estSug(p,c);if(!s.n)return;let d=document.createElement('div');d.className='alert info';d.style.gridColumn='1/-1';d.innerHTML=`<b>🧠 Sugerencia aprendida de ${s.n} estimación${s.n===1?'':'es'}:</b> Calidad ${P(s.q)} · ISR ${P(s.isr)}${s.days?' · período típico '+Math.round(s.days)+' días':''}. <button type="button" class="btn" id="learnApplyEst" style="margin-left:6px">Aplicar para revisar</button>`;f.insertBefore(d,f.firstChild);d.querySelector('#learnApplyEst').onclick=()=>{let q=document.getElementById('eQualityPct'),i=document.getElementById('eIsrPct');q.value=R(s.q);i.value=R(s.isr);q.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('input',{bubbles:true}));toast('Sugerencia aplicada para tu revisión.')}}
function visitForm(){let f=document.getElementById('visitForm');if(!f||f.dataset.learn)return;f.dataset.learn=1;if(store().enabled===false)return;let p=prof();if(!p.visits.gap)return;let n=document.getElementById('vNext')?.closest('.field');if(n)n.insertAdjacentHTML('beforeend',`<small>🧠 Tu historial sugiere seguimiento cada ${Math.round(p.visits.gap)} días.</small>`)}
if(typeof saveDB==='function'&&!saveDB.__learn){let o=saveDB;saveDB=function(){try{prof()}catch(e){}return o.apply(this,arguments)};saveDB.__learn=1}
document.addEventListener('click',e=>{let b=e.target.closest?.('[data-report-kind]');if(!b)return;let s=store();s.reportUsage[b.dataset.reportKind]=(s.reportUsage[b.dataset.reportKind]||0)+1},true);
new MutationObserver(()=>{try{button();estForm();visitForm()}catch(e){console.warn(e)}}).observe(document.documentElement,{subtree:true,childList:true});
setTimeout(()=>{prof();button();estForm();visitForm()},0);window.openAdaptiveLearning=modal;window.adaptiveLearningProfile=prof;
})();
</script>
