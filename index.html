<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<title>Control de Proyectos</title>
<style>
html,body{margin:0;min-height:100%;background:#070a0f;color:#f3f4f6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#loading b{font-size:22px}#loading small{display:block;margin-top:8px;color:#94a3b8}
</style>
</head>
<body>
<div id="loading"><div><b>Control de Proyectos</b><small>Cargando aplicación…</small></div></div>
<script src="bundle-01.js"></script>
<script src="bundle-02.js"></script>
<script src="bundle-03.js"></script>
<script src="bundle-04.js"></script>
<script src="bundle-05.js"></script>
<script src="bundle-06.js"></script>
<script src="bundle-07.js"></script>
<script src="bundle-08.js"></script>
<script src="bundle-09.js"></script>
<script src="bundle-10.js"></script>
<script src="bundle-11.js"></script>
<script src="bundle-12.js"></script>
<script>
(async()=>{
  try{
    const binary=atob(window.__CP_B64||'');
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();
    html=html.replace('</body>','<script src="core-functions-fix.js"><\/script><script src="project-actions-fix.js"><\/script><script src="dashboard-enhancements.js"><\/script><script src="progress-fix.js"><\/script><script src="adjudication-report.js"><\/script><script src="reports-menu-fix.js"><\/script><script src="reports-render-fix.js"><\/script><script src="dashboard-redesign-v3.js"><\/script><script src="project-summary-redesign.js"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loading').innerHTML='<div><b>No se pudo cargar la aplicación.</b><small>'+String(err)+'</small></div>';
  }
})();
</script>
</body>
</html>
