<title>Control de Proyectos</title>
<style>
html,body{margin:0;min-height:100%;background:#070a0f;color:#f3f4f6;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#loading b{font-size:22px}#loading small{display:block;margin-top:8px;color:#94a3b8;max-width:760px}
</style>
</head>
<body>
<div id="loading"><div><b>Control de Proyectos</b><small>Cargando aplicación web…</small></div></div>
<script src="bundle-01.js?v=20260818-full2"></script>
<script src="bundle-02.js?v=20260818-full2"></script>

<script src="bundle-08.js?v=20260818-full2"></script>
<script src="bundle-09.js?v=20260818-full2"></script>
<script src="bundle-10.js?v=20260818-full2"></script>
<script src="bundle-11.js?v=20260818-full2"></script>
<script src="bundle-12.js?v=20260818-full2"></script>
<script>
(async()=>{
  const VERSION='2026-08-18-full2';
  try{
    let b64=String(window.__CP_B64||'').replace(/[^A-Za-z0-9+/=]/g,'');
    b64=b64.replace(/=+$/,'');
    b64+='='.repeat((4-(b64.length%4))%4);
    if(!b64.startsWith('H4sI')) throw new Error('El paquete principal no tiene una cabecera GZIP válida.');
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    if(typeof DecompressionStream!=='function') throw new Error('Este navegador necesita una versión reciente de Edge o Chrome.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('</body>')) throw new Error('El HTML principal se obtuvo incompleto.');
    document.open();document.write(html);document.close();
  }catch(err){
    console.error('Control de Proyectos:',err);
    document.getElementById('loading').innerHTML='<div><b>No se pudo cargar la aplicación.</b><small>'+String(err)+'</small><small style="margin-top:14px">Versión web: '+VERSION+'</small></div>';
  }
})();
</script>
</body>
</html>
