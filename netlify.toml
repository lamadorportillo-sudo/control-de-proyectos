[build]
  command = "node build-pages.cjs && node inject-portfolio.cjs && node patch-session-security.cjs && node stabilize-core-v1.cjs"
  publish = "."

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = false

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.cjs"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
